          {/* Services Horizontal Row List */}
          {services.length === 0 ? (
            <div className="bg-appCard border border-slate-800/80 rounded-2xl p-12 text-center shadow-xl space-y-4 animate-in fade-in">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-emerald-950/50 border border-emerald-500/30 flex items-center justify-center text-3xl">
                ✨
              </div>
              <div className="space-y-1">
                <h3 className="text-base font-bold text-white">Chưa có Service nào được cấu hình</h3>
                <p className="text-xs text-slate-400 max-w-md mx-auto">
                  Bạn có thể bắt đầu bằng cách tự thêm Service mới hoặc nhập file cấu hình JSON có sẵn.
                </p>
              </div>
              <div className="flex items-center justify-center gap-3 pt-2">
                <button
                  onClick={() => setModalService(null)}
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-900/40 transition-all flex items-center space-x-2"
                >
                  <span>➕</span>
                  <span>Thêm Service Đầu Tiên</span>
                </button>
                <button
                  onClick={() => setShowImportModal(true)}
                  className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold border border-slate-700 transition-all flex items-center space-x-1.5"
                >
                  <span>📥</span>
                  <span>Import Cấu Hình</span>
                </button>
              </div>
            </div>
          ) : filteredServices.length === 0 ? (
            <div className="bg-appCard border border-slate-800/80 rounded-2xl p-8 text-center shadow-lg text-slate-400 text-xs">
              🔍 Không tìm thấy service nào phù hợp với từ khóa hoặc bộ lọc đã chọn.
            </div>
          ) : (
            <div className="flex flex-col space-y-3">
              {filteredServices.map(svc => (
                <div
                  key={svc.id}
                  className="bg-appCard border border-slate-800 hover:border-slate-700/80 rounded-xl p-4 shadow-md transition-all flex flex-col xl:flex-row xl:items-center justify-between gap-4"
                >
                  {/* Left: Name, ID, Port, Group */}
                  <div className="flex items-center space-x-4 min-w-[280px]">
                    <div className="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-700/80 flex items-center justify-center text-base font-mono font-bold text-sky-400 flex-shrink-0">
                      {svc.group === 'FE' ? '🖥️' : svc.group === 'BFF' ? '⚡' : '⚙️'}
                    </div>
                    <div className="space-y-1">
                      <div className="flex items-center space-x-2">
                        <h3 className="font-mono text-sm font-bold text-white tracking-wide">{svc.name}</h3>
                        {svc.isWsl && (
                          <span
                            className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-950/80 text-purple-300 border border-purple-600/40 font-mono flex items-center space-x-1"
                            title={`WSL2 Distro: ${svc.wslDistro || 'Ubuntu'} (${svc.wslPath || svc.cwd})`}
                          >
                            <span>🐧</span>
                            <span>WSL2</span>
                          </span>
                        )}
                        <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 font-mono">
                          {svc.group || 'SERVICE'}
                        </span>
                      </div>
                      <div className="flex items-center space-x-2">
                        <span className="font-mono text-[11px] text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800/40 font-semibold">
                          id: {svc.id}
                        </span>
                        <span className="font-mono text-[11px] text-purple-300 bg-purple-950/60 px-2 py-0.5 rounded border border-purple-800/40">
                          :{svc.port}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Middle: Script, Directory & CWD status, Profiles */}
                  <div className="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3 bg-[#050811] px-4 py-2.5 rounded-xl border border-slate-800/80 text-xs font-mono">
                    <div className="flex flex-col justify-center">
                      <span className="text-[10px] text-slate-500 uppercase tracking-wider">Script</span>
                      <span className="text-slate-200 font-semibold truncate" title={`${svc.script} ${(svc.args || []).join(' ')}`}>
                        {svc.script} {(svc.args || []).join(' ')}
                      </span>
                    </div>

                    <div className="flex flex-col justify-center">
                      <span className="text-[10px] text-slate-500 uppercase tracking-wider">Thư mục CWD</span>
                      <div className="flex items-center space-x-1.5 truncate">
                        {svc.cwdExists ? (
                          <span className="text-[10px] font-bold text-emerald-400 flex items-center gap-1">✔ Hợp lệ</span>
                        ) : (
                          <span className="text-[10px] font-bold text-rose-400 flex items-center gap-1">✖ Không thấy</span>
                        )}
                        <span className="text-slate-400 truncate text-[11px]" title={svc.relativeDir || '.'}>({svc.relativeDir || '.'})</span>
                      </div>
                    </div>

                    <div className="flex flex-col justify-center">
                      <span className="text-[10px] text-slate-500 uppercase tracking-wider">Profiles</span>
                      <span className="text-cyan-400 font-semibold truncate">
                        {Object.keys(svc.profiles || {}).length} profiles ({svc.activeProfile})
                      </span>
                    </div>
                  </div>

                  {/* Right: Action Buttons */}
                  <div className="flex items-center space-x-2 flex-shrink-0 justify-end">
                    <button
                      onClick={() => onExportSingle(svc.id)}
                      className="px-2.5 py-1.5 text-xs text-blue-300 hover:text-white bg-blue-950/20 hover:bg-blue-900/40 rounded-lg transition-colors border border-blue-900/40 flex items-center space-x-1"
                      title="Xuất file JSON cho service này"
                    >
                      <span>📤</span>
                      <span>Export</span>
                    </button>

                    <button
                      onClick={() => setModalService(svc)}
                      className="px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors border border-slate-700 flex items-center space-x-1"
                    >
                      <span>✏️</span>
                      <span>Sửa</span>
                    </button>

                    <button
                      onClick={() => handleDelete(svc.id, svc.name)}
                      className="px-3 py-1.5 text-xs font-semibold text-rose-400 hover:text-white bg-rose-950/20 hover:bg-rose-600 rounded-lg transition-colors border border-rose-800/30 flex items-center space-x-1"
                    >
                      <span>🗑️</span>
                      <span>Xóa</span>
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Modals */}
          {modalService !== undefined && (
            <ServiceModal
              service={modalService}
              categories={categories}
              isOpen={true}
              onClose={() => setModalService(undefined)}
              onSave={async (data) => {
                if (modalService) {
                  await onUpdateService(modalService.id, data);
                } else {
                  await onCreateService(data);
                }
                setModalService(undefined);
              }}
            />
          )}

          {showImportModal && (
            <ImportConfigModal
              isOpen={true}
              onClose={() => setShowImportModal(false)}
              onImport={async (data, mode) => {
                await onImportConfig(data, mode);
                setShowImportModal(false);
              }}
            />
          )}

        </div>
      );
    }

    // ================= SERVICE MODAL (CREATE & EDIT) =================
    function ServiceModal({ service, categories = [], isOpen, onClose, onSave }) {
      if (!isOpen) return null;
      const isEdit = !!service;

      const [id, setId] = useState(service?.id || '');
      const [name, setName] = useState(service?.name || '');
      const [group, setGroup] = useState(service?.group || service?.category || 'SERVICE');
      const [category, setCategory] = useState(service?.category || service?.group || 'SERVICE');
      const [port, setPort] = useState(service?.port !== undefined && service?.port !== null ? service.port : '');
      const [script, setScript] = useState(service?.script || 'yarn');
      const [args, setArgs] = useState((service?.args || ['start:dev']).join(' '));
      const [cwd, setCwd] = useState(service?.cwd || service?.relativeDir || '');
      const [isWsl, setIsWsl] = useState(!!service?.isWsl);
      const [wslDistro, setWslDistro] = useState(service?.wslDistro || 'Ubuntu');
      const [availableDistros, setAvailableDistros] = useState(['Ubuntu']);
      const [isWslAvailable, setIsWslAvailable] = useState(false);
      const [detectedEnv, setDetectedEnv] = useState(service?.profiles?.default?.env || null);
      const [detectedEnvSource, setDetectedEnvSource] = useState('');
      const [packageScripts, setPackageScripts] = useState([]);
      const [showEnvEditor, setShowEnvEditor] = useState(false);
      const [rawEnvText, setRawEnvText] = useState(
        service?.profiles?.default?.env
          ? Object.entries(service.profiles.default.env).map(([k, v]) => `${k}=${v}`).join('\n')
          : ''
      );
      const [inspecting, setInspecting] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        fetch('/api/wsl/distros')
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              setIsWslAvailable(data.isAvailable);
              if (data.distros && data.distros.length > 0) {
                setAvailableDistros(data.distros);
                if (!service?.wslDistro && data.defaultDistro) {
                  setWslDistro(data.defaultDistro);
                }
              }
            }
          })
          .catch(e => {});
      }, []);

      const handleInspectCwd = async (folderPath, overrideIsWsl, overrideDistro) => {
        if (!folderPath || typeof folderPath !== 'string') return;
        const clean = folderPath.trim();
        if (!clean) return;
        const useWsl = overrideIsWsl !== undefined ? overrideIsWsl : isWsl;
        const targetDistro = overrideDistro !== undefined ? overrideDistro : wslDistro;

        setInspecting(true);
        try {
          const res = await fetch('/api/inspect-directory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cwd: clean, isWsl: useWsl, wslDistro: targetDistro })
          });
          const data = await res.json();
          if (data.success) {
            if (data.env && Object.keys(data.env).length > 0) {
              setDetectedEnv(data.env);
              setDetectedEnvSource(data.envSource || '.env');
              setRawEnvText(Object.entries(data.env).map(([k, v]) => `${k}=${v}`).join('\n'));

              // Detect Port from common env keys
              const isSocket = (name || id || '').toLowerCase().includes('socket');
              const isWorker = (name || id || '').toLowerCase().includes('consumer') || (name || id || '').toLowerCase().includes('worker');
              if (!isWorker) {
                const portCandidates = [
                  isSocket ? 'NEST_SOCKET_PORT' : null,
                  isSocket ? 'SOCKET_PORT' : null,
                  isSocket ? 'WS_PORT' : null,
                  'NEST_API_PORT',
                  'PORT',
                  'HTTP_PORT',
                  'APP_PORT',
                  'SERVER_PORT',
                  'NEST_SOCKET_PORT',
                  'API_PORT',
                  'VITE_PORT',
                  'PORT_HTTP',
                  'GRPC_PORT'
                ].filter(Boolean);

                for (const k of portCandidates) {
                  if (data.env[k]) {
                    const p = parseInt(data.env[k], 10);
                    if (!isNaN(p) && p > 0) {
                      setPort(p);
                      break;
                    }
                  }
                }
              }
            } else {
              setDetectedEnv(null);
              setDetectedEnvSource('');
              setRawEnvText('');
            }

            // Package.json suggestions
            if (data.packageInfo) {
              if (data.packageInfo.scripts && data.packageInfo.scripts.length > 0) {
                setPackageScripts(data.packageInfo.scripts);
              }
              if (data.packageInfo.bestScript && (!script || script === 'yarn' || script === 'npm')) {
                setScript(data.packageInfo.bestScript.script);
                setArgs(data.packageInfo.bestScript.args);
              }
              // Auto-fill Name & ID if empty
              if (!isEdit && data.packageInfo.name && !name) {
                const baseName = data.packageInfo.name;
                setName(baseName);
                if (!id) setId(baseName.toLowerCase().replace(/[^a-z0-9-]/g, '-'));
              }
            }
          }
        } catch (e) {
          console.error('Inspect directory failed:', e);
        } finally {
          setInspecting(false);
        }
      };

      const handleBrowseFolder = async () => {
        try {
          const res = await fetch('/api/browse-directory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: `Chọn thư mục cho service ${name || id || ''}:`,
              isWsl,
              wslDistro,
              defaultDir: cwd
            })
          });
          const data = await res.json();
          if (data.success && data.path) {
            setCwd(data.path);
            handleInspectCwd(data.path);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleRawEnvChange = (val) => {
        setRawEnvText(val);
        const parsed = {};
        for (const line of val.split('\n')) {
          const clean = line.trim().replace(/^export\s+/, '');
          if (!clean || clean.startsWith('#')) continue;
          const eq = clean.indexOf('=');
          if (eq > 0) {
            const k = clean.slice(0, eq).trim();
            const v = clean.slice(eq + 1).trim().replace(/^["']|["']$/g, '');
            if (k) parsed[k] = v;
          }
        }
        setDetectedEnv(parsed);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (!name.trim()) return setError('Vui lòng nhập Tên Service');
        if (!id.trim()) return setError('Vui lòng nhập Service ID');

        try {
          await onSave({
            id: id.trim().toLowerCase(),
            name: name.trim(),
            group: group.trim().toUpperCase(),
            category: category.trim().toUpperCase(),
            port: port !== '' && port !== null && !isNaN(parseInt(port, 10)) ? parseInt(port, 10) : null,
            script: script.trim(),
            args: args.trim().split(' ').filter(Boolean),
            cwd: cwd.trim(),
            relativeDir: cwd.trim(),
            isWsl: isWsl,
            wslDistro: wslDistro,
            wslPath: cwd.trim(),
            defaultEnv: detectedEnv
          });
        } catch (err) {
          setError(err.message);
        }
      };

      const envCount = detectedEnv ? Object.keys(detectedEnv).length : 0;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-in fade-in">
          <div className="bg-appCard border border-slate-700 rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden animate-in zoom-in-95 duration-150">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-[#090d16]">
              <h3 className="text-base font-bold text-white">
                {isEdit ? `✏️ Chỉnh sửa Service: ${service.name}` : '➕ Thêm Service Mới'}
              </h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white rounded text-base">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto space-y-4 flex-1">
              {error && (
                <div className="p-3 bg-rose-950/40 border border-rose-500/40 text-rose-300 text-xs rounded-xl font-medium">
                  ✖ {error}
                </div>
              )}

              {/* Step 0: WSL2 Toggle Switch */}
              <div className="bg-[#050811] p-3.5 rounded-xl border border-slate-800 flex items-center justify-between transition-all">
                <div className="flex items-center space-x-3">
                  <span className="text-2xl">🐧</span>
                  <div>
                    <label
                      onClick={() => {
                        const next = !isWsl;
                        setIsWsl(next);
                        if (cwd) handleInspectCwd(cwd, next, wslDistro);
                      }}
                      className="text-xs font-bold text-slate-200 block cursor-pointer hover:text-cyan-300"
                    >
                      Chạy trong WSL2 (Windows Subsystem for Linux)
                    </label>
                    <span className="text-[11px] text-slate-400 block">
                      Bật khi thư mục dự án nằm trong ổ đĩa Linux WSL2 (<code className="text-cyan-300">/home/...</code> hoặc <code className="text-cyan-300">~/...</code>)
                    </span>
                  </div>
                </div>

                <div className="flex items-center space-x-2.5 flex-shrink-0">
                  {isWsl && (
                    <div className="flex items-center space-x-1.5 bg-[#0b101c] border border-cyan-700/60 rounded-lg px-2 py-1">
                      <span className="text-[10px] text-slate-400 font-mono">Distro:</span>
                      <select
                        value={wslDistro}
                        onChange={(e) => {
                          setWslDistro(e.target.value);
                          if (cwd) handleInspectCwd(cwd, true, e.target.value);
                        }}
                        className="bg-transparent text-xs font-bold text-cyan-300 focus:outline-none cursor-pointer"
                      >
                        {availableDistros.map((d) => (
                          <option key={d} value={d} className="bg-[#090d16] text-white font-bold">
                            {d}
                          </option>
                        ))}
                      </select>
                    </div>
                  )}

                  <button
                    type="button"
                    onClick={() => {
                      const next = !isWsl;
                      setIsWsl(next);
                      if (cwd) handleInspectCwd(cwd, next, wslDistro);
                    }}
                    className={`w-11 h-6 flex items-center rounded-full p-1 transition-colors duration-200 cursor-pointer ${
                      isWsl ? 'bg-cyan-600' : 'bg-slate-700'
                    }`}
                  >
                    <div
                      className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform duration-200 ${
                        isWsl ? 'translate-x-5' : 'translate-x-0'
                      }`}
                    />
                  </button>
                </div>
              </div>

              {/* Step 1: Thư Mục Service (CWD) */}
              <div className="bg-[#050811] p-4 rounded-xl border border-slate-800 space-y-2.5">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-bold text-slate-200 block">
                    📂 Thư Mục Service (CWD) {isWsl && <span className="text-cyan-400 font-mono text-[11px]">(Đường dẫn WSL2)</span>}
                  </label>
                  {isWsl && (
                    <span className="text-[10px] text-cyan-300 font-mono bg-cyan-950/60 border border-cyan-800 px-2 py-0.5 rounded-md">
                      🐧 Linux Path
                    </span>
                  )}
                </div>
                <div className="flex items-center space-x-2">
                  <input
                    type="text"
                    placeholder={isWsl ? "ví dụ: /home/username/projects/my-service hoặc ~/my-service" : "ví dụ: /Users/thientran/projects/my-service hoặc C:/projects/my-service"}
                    value={cwd}
                    onChange={(e) => {
                      setCwd(e.target.value);
                      handleInspectCwd(e.target.value);
                    }}
                    className="w-full bg-[#0b101c] border border-slate-700 rounded-xl px-3.5 py-2 text-xs font-mono text-cyan-200 focus:outline-none focus:border-cyan-500"
                  />
                  <button
                    type="button"
                    onClick={handleBrowseFolder}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold font-mono whitespace-nowrap flex items-center space-x-1.5 transition-all shadow-md shadow-indigo-900/30 flex-shrink-0"
                    title={isWsl ? "Mở hộp thoại chọn thư mục WSL2" : "Mở hộp thoại chọn thư mục"}
                  >
                    <span>📂</span>
                    <span>{isWsl ? 'Chọn Thư Mục WSL...' : 'Chọn Thư Mục...'}</span>
                  </button>
                </div>

                {/* Auto-detected .env / .env.example banner */}
                {inspecting && (
                  <div className="text-[11px] text-slate-400 font-mono flex items-center gap-1.5 pt-0.5">
                    <span className="animate-spin">⚙️</span> Đang kiểm tra file .env & package.json...
                  </div>
                )}

                {detectedEnvSource && detectedEnv && (
                  <div className="bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 p-2.5 rounded-xl text-xs font-mono flex items-center justify-between animate-in fade-in">
                    <div className="flex items-center space-x-2">
                      <span className="text-base">📄</span>
                      <div>
                        <span className="font-bold text-white">Đã nạp {detectedEnvSource}</span>
                        <span className="text-emerald-400 text-[11px] ml-2">({envCount} biến cho Default Profile)</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* Toggle Button for Inline Env Editor */}
                <div className="pt-1">
                  <button
                    type="button"
                    onClick={() => setShowEnvEditor(!showEnvEditor)}
                    className="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-[#090e1b] hover:bg-[#0d1426] border border-slate-700/80 text-xs font-mono text-slate-300 hover:text-white transition-all group"
                  >
                    <span className="flex items-center space-x-2">
                      <span className="text-cyan-400">📝</span>
                      <span className="font-bold">{showEnvEditor ? 'Ẩn Trình Sửa Biến Môi Trường' : 'Xem & Sửa Biến Môi Trường (.env)'}</span>
                      <span className={`text-[10px] font-bold px-2 py-0.2 rounded-full ${envCount > 0 ? 'bg-cyan-950 text-cyan-300 border border-cyan-800' : 'bg-slate-800 text-slate-400'}`}>
                        {envCount} biến
                      </span>
                    </span>
                    <span className="text-[11px] text-slate-400 group-hover:text-cyan-300 transition-colors font-bold">
                      {showEnvEditor ? '▲ Thu gọn' : '▼ Mở rộng'}
                    </span>
                  </button>

                  {/* Inline .env Textarea Editor */}
                  {showEnvEditor && (
                    <div className="mt-2 bg-[#080d1a] p-3 rounded-xl border border-slate-700/80 space-y-2 animate-in fade-in">
                      <div className="flex items-center justify-between text-[11px] text-slate-400 font-mono">
                        <span>Chỉnh sửa trực tiếp file .env của Profile Default:</span>
                        <span className="text-cyan-300 font-bold">{envCount} biến</span>
                      </div>
                      <textarea
                        rows={6}
                        value={rawEnvText}
                        onChange={(e) => handleRawEnvChange(e.target.value)}
                        placeholder={"# Nhập hoặc dán các biến môi trường tại đây\nPORT=3000\nNODE_ENV=development\nDATABASE_URL=postgres://..."}
                        className="w-full bg-[#050811] border border-slate-700 rounded-lg p-2.5 text-xs font-mono text-cyan-200 focus:outline-none focus:border-cyan-500 shadow-inner"
                      />
                    </div>
                  )}
                </div>
              </div>

              {/* Step 2: Name & ID */}
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Tên Hiển Thị (Display Name) *</label>
                  <input
                    type="text"
                    placeholder="ví dụ: Accounting Service"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full bg-[#050811] border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <div>
                  <label className="text-xs text-slate-400 block mb-1">Service ID (mã định danh duy nhất) *</label>
                  <input
                    type="text"
                    disabled={isEdit}
                    placeholder="ví dụ: acc-service, auth-api"
                    value={id}
                    onChange={(e) => setId(e.target.value.toLowerCase())}
                    className="w-full bg-[#050811] border border-slate-700 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-emerald-500 disabled:opacity-50"
                  />
                </div>
              </div>

              {/* Step 3: Group & Category */}
              <div>
                <label className="text-xs text-slate-300 block mb-1 font-bold">Danh Mục / Nhóm (Category) *</label>
                <select
                  value={group}
                  onChange={(e) => {
                    setGroup(e.target.value);
                    setCategory(e.target.value);
                  }}
                  className="w-full bg-[#050811] border border-slate-700 rounded-lg p-2 text-xs font-mono text-cyan-300 focus:outline-none focus:border-emerald-500 cursor-pointer"
                >
                  {categories && categories.length > 0 ? (
                    categories.map(c => (
                      <option key={c.id} value={c.id}>
                        {c.icon || '📁'} {c.name || c.id} ({c.id})
                      </option>
                    ))
                  ) : (
                    <>
                      <option value="SERVICE">📁 SERVICE (Mặc định)</option>
                      <option value="FE">🖥️ FRONTEND (FE)</option>
                      <option value="BFF">⚡ BFF</option>
                      <option value="WORKER">⚙️ WORKER</option>
                      <option value="GATEWAY">🚪 GATEWAY</option>
                      <option value="OTHER">📦 OTHER</option>
                    </>
                  )}
                </select>
              </div>

              {/* Step 4: Script, Args & Package.json Suggestions */}
              <div className="space-y-2">
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Lệnh Thực Thi (Script Command)</label>
                    <input
                      type="text"
                      placeholder="yarn, npm, pnpm, node, bash"
                      value={script}
                      onChange={(e) => setScript(e.target.value)}
                      className="w-full bg-[#050811] border border-slate-700 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Tham Số Chạy (Script Args)</label>
                    <input
                      type="text"
                      placeholder="start:dev, run dev, -e ..."
                      value={args}
                      onChange={(e) => setArgs(e.target.value)}
                      className="w-full bg-[#050811] border border-slate-700 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                {/* Package.json Scripts Suggestions */}
                {packageScripts.length > 0 && (
                  <div className="pt-1 bg-[#050811] p-2.5 rounded-xl border border-slate-800 space-y-1.5 animate-in fade-in">
                    <span className="text-[11px] font-mono text-slate-400 block">
                      ⚡ Gợi ý lệnh chạy tìm thấy từ <strong className="text-amber-400">package.json</strong> (bấm để chọn nhanh):
                    </span>
                    <div className="flex flex-wrap gap-1.5">
                      {packageScripts.map((ps) => {
                        const isChosen = script === ps.script && args === ps.args;
                        return (
                          <button
                            key={ps.name}
                            type="button"
                            onClick={() => {
                              setScript(ps.script);
                              setArgs(ps.args);
                            }}
                            className={`px-2.5 py-1 rounded-lg text-xs font-mono font-semibold transition-all border ${
                              isChosen
                                ? 'bg-amber-500 text-black border-amber-400 font-bold shadow-md'
                                : 'bg-[#090e1b] hover:bg-slate-800 text-slate-300 hover:text-white border-slate-700'
                            }`}
                            title={`Lệnh: ${ps.rawCommand || ps.display}`}
                          >
                            ⚡ {ps.display}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>

              <div className="flex justify-end space-x-3 pt-3 border-t border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs text-slate-400 hover:text-white bg-slate-800 rounded-xl"
                >
                  Hủy
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl shadow-lg shadow-emerald-900/30 font-mono"
                >
                  {isEdit ? 'Lưu Thay Đổi' : 'Tạo Service Mới'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ================= IMPORT CONFIG MODAL =================
    function ImportConfigModal({ isOpen, onClose, onImport }) {
      if (!isOpen) return null;

      const [importMode, setImportMode] = useState('merge'); // 'merge' | 'overwrite'
      const [parsedData, setParsedData] = useState(null);
      const [fileName, setFileName] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setFileName(file.name);
        setError('');

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const json = JSON.parse(evt.target.result);
            if (!json.services && !json.service) {
              throw new Error('File JSON không chứa trường "services" hoặc "service" hợp lệ!');
            }
            setParsedData(json);
          } catch (err) {
            setError('Lỗi phân tích file JSON: ' + err.message);
            setParsedData(null);
          }
        };
        reader.readAsText(file);
      };

      const handleDoImport = async () => {
        if (!parsedData) return;
        setLoading(true);
        setError('');
        try {
          await onImport(parsedData, importMode);
        } catch (err) {
          setError(err.message);
          setLoading(false);
        }
      };

      const incomingServices = parsedData ? (Array.isArray(parsedData.services) ? parsedData.services : [parsedData.service]) : [];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
          <div className="bg-appCard border border-slate-700 rounded-2xl w-full max-w-xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden animate-in zoom-in-95 duration-150">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-[#090d16]">
              <h3 className="text-base font-bold text-white flex items-center gap-2">
                <span>📥 Import Cấu Hình Services & Env</span>
              </h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white rounded text-base">✕</button>
            </div>

            <div className="p-6 overflow-y-auto space-y-4 flex-1">
              {error && (
                <div className="p-3 bg-rose-950/40 border border-rose-500/40 text-rose-300 text-xs rounded-xl font-medium">
                  ✖ {error}
                </div>
              )}

              {/* File upload dropzone */}
              <div>
                <label className="text-xs text-slate-400 block mb-1.5">Chọn file cấu hình JSON (.json):</label>
                <input
                  type="file"
                  accept=".json"
                  onChange={handleFileChange}
                  className="w-full bg-[#050811] border border-dashed border-slate-700 rounded-xl p-3 text-xs text-slate-300 focus:outline-none file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"
                />
              </div>

              {/* Preview */}
              {parsedData && (
                <div className="space-y-3 bg-[#050811] p-4 rounded-xl border border-slate-800">
                  <div className="flex items-center justify-between text-xs">
                    <span className="text-slate-400">File: <span className="text-cyan-300 font-mono">{fileName}</span></span>
                    <span className="text-emerald-400 font-bold font-mono">{incomingServices.length} services</span>
                  </div>

                  <div className="max-h-36 overflow-y-auto space-y-1.5 pr-1">
                    {incomingServices.map(s => (
                      <div key={s.id} className="flex items-center justify-between bg-[#0b101c] p-2 rounded-lg text-xs font-mono">
                        <span className="text-white font-bold">{s.name}</span>
                        <div className="flex items-center space-x-2 text-[11px]">
                          <span className="text-purple-300">:{s.port}</span>
                          <span className="text-slate-400">{s.group || 'SERVICE'}</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Mode Option */}
                  <div className="pt-2 border-t border-slate-800 space-y-2">
                    <label className="text-xs font-bold text-slate-300 block">Chế độ Import:</label>
                    <div className="space-y-1.5">
                      <label className="flex items-center space-x-2 cursor-pointer text-xs text-slate-300">
                        <input
                          type="radio"
                          name="importMode"
                          value="merge"
                          checked={importMode === 'merge'}
                          onChange={() => setImportMode('merge')}
                          className="accent-indigo-500"
                        />
                        <span><strong>Gộp bổ sung (Merge)</strong> — Giữ các service cũ và thêm/cập nhật service mới (Khuyên dùng)</span>
                      </label>

                      <label className="flex items-center space-x-2 cursor-pointer text-xs text-rose-300">
                        <input
                          type="radio"
                          name="importMode"
                          value="overwrite"
                          checked={importMode === 'overwrite'}
                          onChange={() => setImportMode('overwrite')}
                          className="accent-rose-500"
                        />
                        <span><strong>Ghi đè hoàn toàn (Overwrite)</strong> — Xóa danh sách cũ và thay thế bằng file này</span>
                      </label>
                    </div>
                  </div>
                </div>
              )}

              <div className="flex justify-end space-x-3 pt-3 border-t border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs text-slate-400 hover:text-white bg-slate-800 rounded-xl"
                >
                  Hủy
                </button>
                <button
                  disabled={!parsedData || loading}
                  onClick={handleDoImport}
                  className="px-5 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 rounded-xl shadow-lg shadow-indigo-900/30"
                >
                  {loading ? 'Đang Import...' : 'Nạp Cấu Hình'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
