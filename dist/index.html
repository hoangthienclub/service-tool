<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Monitor & Env Manager</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appDark: '#070a12',
            appSidebar: '#090d18',
            appCard: '#0d1322',
            appCardRunning: '#0d1726',
            appCardStopped: '#110f18',
            appBorder: '#1e293b',
            terminalBg: '#050811',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050811; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    /* ANSI Highlight colors */
    .ansi-black { color: #64748b; }
    .ansi-red { color: #f87171; font-weight: 600; }
    .ansi-green { color: #4ade80; }
    .ansi-yellow { color: #facc15; }
    .ansi-blue { color: #60a5fa; }
    .ansi-magenta { color: #c084fc; }
    .ansi-cyan { color: #38bdf8; }
    .ansi-white { color: #f8fafc; }
    .ansi-bright-black { color: #94a3b8; }
    .ansi-bright-red { color: #ef4444; font-weight: 700; }
    .ansi-bright-green { color: #22c55e; }
    .ansi-bright-yellow { color: #eab308; }
    .ansi-bright-blue { color: #3b82f6; }
    .ansi-bright-magenta { color: #a855f7; }
    .ansi-bright-cyan { color: #06b6d4; }
    .ansi-bright-white { color: #ffffff; }

    /* Glowing borders */
    .glow-running {
      box-shadow: 0 0 25px -4px rgba(16, 185, 129, 0.35), 0 0 10px -2px rgba(16, 185, 129, 0.2);
    }
    .glow-stopped {
      box-shadow: 0 0 20px -5px rgba(244, 63, 94, 0.25);
    }

    /* macOS Window Drag Regions */
    .app-drag-region {
      -webkit-app-region: drag;
      user-select: none;
    }
    .app-no-drag {
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body class="bg-appDark text-slate-200 antialiased font-sans min-h-screen selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ANSI parser
    function parseAnsi(text) {
      if (!text) return '';
      let str = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const colors = {
        '30': 'ansi-black', '31': 'ansi-red', '32': 'ansi-green', '33': 'ansi-yellow',
        '34': 'ansi-blue', '35': 'ansi-magenta', '36': 'ansi-cyan', '37': 'ansi-white',
        '90': 'ansi-bright-black', '91': 'ansi-bright-red', '92': 'ansi-bright-green',
        '93': 'ansi-bright-yellow', '94': 'ansi-bright-blue', '95': 'ansi-bright-magenta',
        '96': 'ansi-bright-cyan', '97': 'ansi-bright-white'
      };

      str = str.replace(/\x1b\[(\d+)m/g, (match, code) => {
        if (code === '0') return '</span>';
        if (colors[code]) return `<span class="${colors[code]}">`;
        if (code === '1') return '<span class="font-bold">';
        return '';
      });

      return str;
    }

    function App() {
      const [services, setServices] = useState([]);
      const [logsMap, setLogsMap] = useState({});
      const [activeCategory, setActiveCategory] = useState('ALL');
      const [viewMode, setViewMode] = useState('monitor'); // 'monitor' | 'env-setup' | 'categories' | 'services'
      const [monitorViewType, setMonitorViewType] = useState('console'); // 'console' | 'grid'
      const [selectedServiceId, setSelectedServiceId] = useState('');
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      
      const [envModalService, setEnvModalService] = useState(null);
      const [scriptModalService, setScriptModalService] = useState(null);
      const [popoutService, setPopoutService] = useState(null);

      const [currentRunningTask, setCurrentRunningTask] = useState(null);
      const [lastTaskLog, setLastTaskLog] = useState('');
      const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);

      const handleReloadAll = async () => {
        await fetchServices();
        if (typeof fetchCategories === 'function') await fetchCategories();
      };

      // Fetch Services
      const fetchServices = useCallback(async () => {
        setIsRefreshing(true);
        try {
          const res = await fetch('/api/services');
          const data = await res.json();
          if (data.success) {
            setServices(data.services);
            if (!selectedServiceId && data.services.length > 0) {
              setSelectedServiceId(data.services[0].id);
            }
          }
        } catch (err) {
          console.error('Failed to fetch services:', err);
        } finally {
          setIsRefreshing(false);
        }
      }, [selectedServiceId]);

      // Connect SSE
      useEffect(() => {
        fetchServices();

        const eventSource = new EventSource('/api/events');

        eventSource.addEventListener('initial-state', (e) => {
          const data = JSON.parse(e.data);
          if (data.services) {
            const combined = data.services.map(s => ({
              ...s,
              statusInfo: data.statuses[s.id] || { status: 'STOPPED' }
            }));
            setServices(combined);
          }
        });

        eventSource.addEventListener('status-change', (e) => {
          const data = JSON.parse(e.data);
          setServices((prev) =>
            prev.map((s) =>
              s.id === data.serviceId
                ? { ...s, statusInfo: { ...s.statusInfo, status: data.status, pid: data.pid } }
                : s
            )
          );
        });

        eventSource.addEventListener('service-log', (e) => {
          const data = JSON.parse(e.data);
          setLogsMap((prev) => {
            const current = prev[data.serviceId] || [];
            return {
              ...prev,
              [data.serviceId]: [...current.slice(-1999), data]
            };
          });
        });

        eventSource.addEventListener('log-cleared', (e) => {
          const data = JSON.parse(e.data);
          setLogsMap((prev) => ({
            ...prev,
            [data.serviceId]: []
          }));
        });

        eventSource.addEventListener('task-start', (e) => {
          const data = JSON.parse(e.data);
          setCurrentRunningTask(data.task);
          setLastTaskLog(`Bắt đầu task: ${data.task}`);
        });

        eventSource.addEventListener('task-log', (e) => {
          const data = JSON.parse(e.data);
          setLastTaskLog(data.text);
        });

        eventSource.addEventListener('task-finish', (e) => {
          const data = JSON.parse(e.data);
          setCurrentRunningTask(null);
          setLastTaskLog(data.success ? `✔ Hoàn thành task ${data.task}` : `✖ Thất bại task ${data.task}`);
        });

        eventSource.addEventListener('service-updated', (e) => {
          const updatedSvc = JSON.parse(e.data);
          setServices((prev) =>
            prev.map((s) => (s.id === updatedSvc.id ? { ...s, ...updatedSvc } : s))
          );
        });

        return () => {
          eventSource.close();
        };
      }, [fetchServices]);

      // Service Actions
      const handleStartService = async (id) => {
        setServices((prev) =>
          prev.map((s) => (s.id === id ? { ...s, statusInfo: { ...s.statusInfo, status: 'STARTING' } } : s))
        );
        try {
          const res = await fetch(`/api/services/${encodeURIComponent(id)}/start`, { method: 'POST' });
          const data = await res.json();
          if (data.status) {
            setServices((prev) =>
              prev.map((s) => (s.id === id ? { ...s, statusInfo: { ...s.statusInfo, ...data.status } } : s))
            );
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleStopService = async (id) => {
        setServices((prev) =>
          prev.map((s) => (s.id === id ? { ...s, statusInfo: { ...s.statusInfo, status: 'STOPPING' } } : s))
        );
        try {
          const res = await fetch(`/api/services/${encodeURIComponent(id)}/stop`, { method: 'POST' });
          const data = await res.json();
          if (data.status) {
            setServices((prev) =>
              prev.map((s) => (s.id === id ? { ...s, statusInfo: { ...s.statusInfo, ...data.status } } : s))
            );
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleRestartService = async (id) => {
        setServices((prev) =>
          prev.map((s) => (s.id === id ? { ...s, statusInfo: { ...s.statusInfo, status: 'RESTARTING' } } : s))
        );
        try {
          const res = await fetch(`/api/services/${encodeURIComponent(id)}/restart`, { method: 'POST' });
          const data = await res.json();
          if (data.status) {
            setServices((prev) =>
              prev.map((s) => (s.id === id ? { ...s, statusInfo: { ...s.statusInfo, ...data.status } } : s))
            );
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleClearLogs = async (id) => {
        await fetch(`/api/services/${encodeURIComponent(id)}/clear-logs`, { method: 'POST' });
      };

      const handleChangeProfile = async (id, profile) => {
        const res = await fetch(`/api/services/${id}/active-profile`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profile })
        });
        const data = await res.json();
        if (data.success && data.service) {
          setServices((prev) =>
            prev.map((s) => (s.id === id ? { ...s, ...data.service } : s))
          );
        }
        return data;
      };

      const handleSaveEnvOverrides = async (id, overrides) => {
        const res = await fetch(`/api/services/${id}/env-overrides`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ overrides })
        });
        const data = await res.json();
        if (data.success && data.service) {
          setServices((prev) =>
            prev.map((s) => (s.id === id ? { ...s, ...data.service } : s))
          );
        }
        return data;
      };

      const handleCreateCustomProfile = async (id, profileKey, profileData) => {
        const res = await fetch(`/api/services/${id}/custom-profile`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profileKey, profileData })
        });
        const data = await res.json();
        if (data.success && data.service) {
          setServices((prev) =>
            prev.map((s) => (s.id === id ? { ...s, ...data.service } : s))
          );
        }
        return data;
      };

      const handleDeleteCustomProfile = async (id, profileKey) => {
        const res = await fetch(`/api/services/${id}/custom-profile/${profileKey}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        if (data.success && data.service) {
          setServices((prev) =>
            prev.map((s) => (s.id === id ? { ...s, ...data.service } : s))
          );
        }
        return data;
      };

      const handleApplyGlobalEnv = async (globalVars) => {
        const res = await fetch('/api/global-env', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ globalVars })
        });
        return res.json();
      };

      const handleSetAllActiveProfile = async (profile) => {
        const res = await fetch('/api/all/active-profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profile })
        });
        const data = await res.json();
        if (data.success && data.services) {
          setServices(data.services);
        }
        return data;
      };

      const handleStartGroup = async (groupName) => {
        setServices((prev) =>
          prev.map((s) => ((s.group || s.category || '').toUpperCase() === groupName.toUpperCase() ? { ...s, statusInfo: { ...s.statusInfo, status: 'STARTING' } } : s))
        );
        try {
          await fetch(`/api/groups/${encodeURIComponent(groupName)}/start`, { method: 'POST' });
          setTimeout(fetchServices, 1000);
        } catch (e) {
          console.error(e);
        }
      };

      const handleStopGroup = async (groupName) => {
        setServices((prev) =>
          prev.map((s) => ((s.group || s.category || '').toUpperCase() === groupName.toUpperCase() ? { ...s, statusInfo: { ...s.statusInfo, status: 'STOPPING' } } : s))
        );
        try {
          await fetch(`/api/groups/${encodeURIComponent(groupName)}/stop`, { method: 'POST' });
          setTimeout(fetchServices, 1000);
        } catch (e) {
          console.error(e);
        }
      };

      const handleStartAll = async () => {
        setServices((prev) => prev.map((s) => ({ ...s, statusInfo: { ...s.statusInfo, status: 'STARTING' } })));
        try {
          await fetch('/api/all/start', { method: 'POST' });
          setTimeout(fetchServices, 1000);
        } catch (e) {
          console.error(e);
        }
      };

      const handleStopAll = async () => {
        setServices((prev) => prev.map((s) => ({ ...s, statusInfo: { ...s.statusInfo, status: 'STOPPING' } })));
        try {
          await fetch('/api/all/stop', { method: 'POST' });
          setTimeout(fetchServices, 1000);
        } catch (e) {
          console.error(e);
        }
      };

      const handleRestartAll = async () => {
        setServices((prev) => prev.map((s) => ({ ...s, statusInfo: { ...s.statusInfo, status: 'RESTARTING' } })));
        try {
          await fetch('/api/all/restart', { method: 'POST' });
          setTimeout(fetchServices, 1200);
        } catch (e) {
          console.error(e);
        }
      };

      const handleRestartGroup = async (groupName) => {
        setServices((prev) =>
          prev.map((s) => ((s.group || s.category || '').toUpperCase() === groupName.toUpperCase() ? { ...s, statusInfo: { ...s.statusInfo, status: 'RESTARTING' } } : s))
        );
        try {
          await fetch(`/api/groups/${encodeURIComponent(groupName)}/restart`, { method: 'POST' });
          setTimeout(fetchServices, 1200);
        } catch (e) {
          console.error(e);
        }
      };

      const handleRunTask = async (taskType) => {
        await fetch(`/api/tasks/${taskType}`, { method: 'POST' });
      };

      const handleRunServiceTask = async (serviceId, taskType) => {
        await fetch(`/api/services/${encodeURIComponent(serviceId)}/task/${taskType}`, { method: 'POST' });
      };

      const handleRunCustomScript = async (serviceId, scriptConfig) => {
        try {
          const res = await fetch(`/api/services/${encodeURIComponent(serviceId)}/run-custom-script`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(scriptConfig)
          });
          const data = await res.json();
          if (!data.success) {
            alert('Lỗi: ' + (data.error || 'Không thể chạy script'));
          }
        } catch (e) {
          alert('Lỗi kết nối: ' + e.message);
        }
      };

      const handleKillPort = async (serviceId) => {
        setServices((prev) =>
          prev.map((s) => (s.id === serviceId ? { ...s, statusInfo: { ...s.statusInfo, status: 'STOPPED', pid: null } } : s))
        );
        try {
          await fetch(`/api/services/${encodeURIComponent(serviceId)}/kill-port`, { method: 'POST' });
          fetchServices();
        } catch (e) {
          console.error(e);
        }
      };

      const handleKillAllPorts = async () => {
        if (!confirm('Bạn có chắc chắn muốn giải phóng (Kill) toàn bộ port của tất cả microservices không?')) return;
        setServices((prev) => prev.map((s) => ({ ...s, statusInfo: { ...s.statusInfo, status: 'STOPPED', pid: null } })));
        try {
          await fetch('/api/all/kill-ports', { method: 'POST' });
          fetchServices();
        } catch (e) {
          console.error(e);
        }
      };

      // ================= TEMPLATES & DYNAMIC SERVICE CRUD =================
      const [templates, setTemplates] = useState([]);

      const fetchTemplates = useCallback(async () => {
        try {
          const res = await fetch('/api/templates');
          const data = await res.json();
          if (data.templates) setTemplates(data.templates);
        } catch (e) {
          console.error('Failed to fetch templates:', e);
        }
      }, []);

      useEffect(() => {
        fetchTemplates();
      }, [fetchTemplates]);

      // ================= CATEGORIES MANAGEMENT =================
      const [categories, setCategories] = useState([]);

      const fetchCategories = useCallback(async () => {
        try {
          const res = await fetch('/api/categories');
          const data = await res.json();
          if (data.success && Array.isArray(data.categories)) {
            setCategories(data.categories);
          }
        } catch (e) {
          console.error('Failed to fetch categories:', e);
        }
      }, []);

      useEffect(() => {
        fetchCategories();
      }, [fetchCategories]);

      const handleCreateCategory = async (catData) => {
        const res = await fetch('/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(catData)
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Tạo danh mục thất bại');
        setCategories(data.categories);
        await fetchServices();
        return data;
      };

      const handleUpdateCategory = async (catId, catData) => {
        const res = await fetch(`/api/categories/${encodeURIComponent(catId)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(catData)
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Cập nhật danh mục thất bại');
        setCategories(data.categories);
        await fetchServices();
        return data;
      };

      const handleDeleteCategory = async (catId, fallback = 'SERVICE') => {
        const res = await fetch(`/api/categories/${encodeURIComponent(catId)}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fallbackCategory: fallback })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Xóa danh mục thất bại');
        setCategories(data.categories);
        await fetchServices();
        return data;
      };

      const handleCreateService = async (serviceData) => {
        const res = await fetch('/api/services', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(serviceData)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create service');
        await fetchServices();
        return data;
      };

      const handleUpdateService = async (serviceId, serviceData) => {
        const res = await fetch(`/api/services/${serviceId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(serviceData)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to update service');
        await fetchServices();
        return data;
      };

      const handleDeleteService = async (serviceId) => {
        const res = await fetch(`/api/services/${serviceId}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to delete service');
        await fetchServices();
        return data;
      };

      const handleResetServices = async () => {
        if (!confirm('Bạn có chắc chắn muốn khôi phục danh sách các services mặc định không?')) return;
        await fetch('/api/services/reset', { method: 'POST' });
        await fetchServices();
      };

      const handleExportAll = () => {
        window.open('/api/export/all', '_blank');
      };

      const handleExportSingle = (serviceId) => {
        window.open(`/api/services/${serviceId}/export`, '_blank');
      };

      const handleImportConfig = async (importData, mode = 'merge') => {
        const res = await fetch('/api/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: importData, mode })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to import config');
        await fetchServices();
        return data;
      };

      const availableGroups = useMemo(() => {
        const set = new Set();
        categories.forEach(c => {
          if (c.id) set.add(c.id.toUpperCase());
        });
        services.forEach(s => {
          const g = (s.group || s.category || '').trim();
          if (g) set.add(g.toUpperCase());
        });
        const list = Array.from(set);
        return list.length > 0 ? ['ALL', ...list] : ['ALL'];
      }, [services, categories]);

      useEffect(() => {
        if (!availableGroups.includes(activeCategory)) {
          setActiveCategory('ALL');
        }
      }, [availableGroups, activeCategory]);

      const filteredServices = activeCategory === 'ALL'
        ? services
        : services.filter(s => (s.group || s.category || '').toUpperCase() === activeCategory);

      const monitorGroups = useMemo(() => {
        if (activeCategory !== 'ALL') {
          return [activeCategory];
        }
        const distinct = Array.from(new Set(filteredServices.map(s => (s.group || s.category || 'SERVICE').toUpperCase())));
        return distinct.length > 0 ? distinct : ['SERVICE'];
      }, [filteredServices, activeCategory]);

      const runningCount = services.filter(s => s.statusInfo?.status === 'RUNNING').length;
      const selectedService = services.find(s => s.id === selectedServiceId) || services[0];
      const allAvailableProfiles = useMemo(() => {
        const list = Array.from(new Set(
          services.flatMap(s => Object.keys(s.profiles || {}))
        ));
        return list.length > 0 ? list : ['default'];
      }, [services]);

      const currentGlobalProfile = services.length > 0 && services.every(s => s.activeProfile === services[0].activeProfile)
        ? services[0].activeProfile
        : (services.length === 0 ? 'default' : 'mixed');

      return (
        <div className="flex h-screen overflow-hidden bg-appDark">
          
          {/* ================= LEFT SIDEBAR ================= */}
          <aside className={`${sidebarCollapsed ? 'w-20' : 'w-64'} flex-shrink-0 bg-appSidebar border-r border-slate-800/80 flex flex-col justify-between transition-all duration-300 z-30`}>
            <div>
              {/* macOS Traffic Lights Clearance Spacer */}
              <div className="h-9 w-full app-drag-region flex-shrink-0"></div>

              {/* Brand Logo Header */}

                  </button>

          {/* Backup & Restore Full Data Modal */}

    // ================= ENV SETUP PAGE (Modern & Unrestricted Profiles) =================
    function EnvSetupPage({
      services = [],
      selectedServiceId,
      onSelectService,
      onSaveOverrides,
      onChangeProfile,
      onCreateProfile,
      onDeleteProfile,
      onApplyGlobalEnv,
      onRestartService
    }) {
      const [activeTab, setActiveTab] = useState(
        selectedServiceId && services.some(s => s.id === selectedServiceId)
          ? selectedServiceId
          : (services.length > 0 ? services[0].id : 'global')
      );
      const [editorMode, setEditorMode] = useState('table'); // 'table' | 'raw'
      const [searchQuery, setSearchQuery] = useState('');
      const [rawText, setRawText] = useState('');
      const [envPairs, setEnvPairs] = useState([]);
      const [saveStatus, setSaveStatus] = useState('');
      const [newKey, setNewKey] = useState('');
      const [newValue, setNewValue] = useState('');
      const [copiedKey, setCopiedKey] = useState('');

      // Global shared config state with profiles
      const [globalProfiles, setGlobalProfiles] = useState({ default: { env: {} } });
      const [activeGlobalProfile, setActiveGlobalProfile] = useState('default');
      const [globalEnvPairs, setGlobalEnvPairs] = useState([]);

      // Fetch global env from server on mount
      useEffect(() => {
        fetch('/api/global-env')
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              if (data.globalProfiles) setGlobalProfiles(data.globalProfiles);
              if (data.activeGlobalProfile) setActiveGlobalProfile(data.activeGlobalProfile);
              const env = data.globalEnv || {};
              const pairs = Object.entries(env).map(([key, value]) => ({
                key,
                value: String(value)
              }));
              setGlobalEnvPairs(pairs);
            }
          })
          .catch(e => console.error('Failed to fetch global env:', e));
      }, []);

      const handleChangeGlobalProfile = async (profileKey) => {
        try {
          const res = await fetch('/api/global-env/active-profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profile: profileKey })
          });
          const data = await res.json();
          if (data.success) {
            setActiveGlobalProfile(data.activeGlobalProfile);
            if (data.globalProfiles) setGlobalProfiles(data.globalProfiles);
            const pairs = Object.entries(data.globalEnv || {}).map(([key, value]) => ({ key, value: String(value) }));
            setGlobalEnvPairs(pairs);
            setEnvPairs(pairs);
            setRawText(pairs.map(p => `${p.key}=${p.value}`).join('\n'));
          }
        } catch (e) {
          console.error('Failed to change global profile:', e);
        }
      };

      // New profile modal & Copy from modal
      const [showNewProfileModal, setShowNewProfileModal] = useState(false);
      const [newProfileKey, setNewProfileKey] = useState('');
      const [newProfileName, setNewProfileName] = useState('');
      const [showCopyFromModal, setShowCopyFromModal] = useState(false);

      const currentService = services.find(s => s.id === activeTab);
      const profileKeys = Object.keys(currentService?.profiles || {});
      const activeProfileKey = currentService?.activeProfile || profileKeys[0] || '';

      // Sync env pairs & raw text when switching service/tab/profile
      useEffect(() => {
        if (activeTab === 'global') {
          setEnvPairs(globalEnvPairs);
          const lines = globalEnvPairs.map(p => `${p.key}=${p.value}`).join('\n');
          setRawText(lines);
          return;
        }

        if (currentService) {
          const profileEnv = currentService.profiles?.[activeProfileKey]?.env || currentService.computedEnv || {};
          const pairs = Object.entries(profileEnv).map(([key, value]) => ({
            key,
            value: String(value)
          }));
          setEnvPairs(pairs);

          const lines = pairs.map(p => `${p.key}=${p.value}`).join('\n');
          setRawText(lines);
        }
      }, [activeTab, currentService, activeProfileKey, globalEnvPairs]);

      // Parse Raw Text to Pairs
      const handleRawTextChange = (text) => {
        setRawText(text);
        const lines = text.split('\n');
        const parsed = [];
        for (const line of lines) {
          const clean = line.trim().replace(/^export\s+/, '');
          if (!clean || clean.startsWith('#')) continue;
          const eqIdx = clean.indexOf('=');
          if (eqIdx !== -1) {
            const k = clean.slice(0, eqIdx).trim();
            const v = clean.slice(eqIdx + 1).trim().replace(/^["']|["']$/g, '');
            if (k) parsed.push({ key: k, value: v });
          }
        }
        setEnvPairs(parsed);
        if (activeTab === 'global') {
          setGlobalEnvPairs(parsed);
        }
      };

      const handleTableValueChange = (index, val) => {
        const updated = [...envPairs];
        updated[index].value = val;
        setEnvPairs(updated);
        setRawText(updated.map(p => `${p.key}=${p.value}`).join('\n'));
        if (activeTab === 'global') {
          setGlobalEnvPairs(updated);
        }
      };

      const handleAddPair = () => {
        if (!newKey.trim()) return;
        const formattedKey = newKey.trim().toUpperCase().replace(/\s+/g, '_');
        const existingIdx = envPairs.findIndex(p => p.key === formattedKey);
        let updated;
        if (existingIdx >= 0) {
          updated = [...envPairs];
          updated[existingIdx].value = newValue;
        } else {
          updated = [{ key: formattedKey, value: newValue }, ...envPairs];
        }
        setEnvPairs(updated);
        setRawText(updated.map(p => `${p.key}=${p.value}`).join('\n'));
        if (activeTab === 'global') {
          setGlobalEnvPairs(updated);
        }
        setNewKey('');
        setNewValue('');
      };

      const handleDeletePair = (index) => {
        const updated = envPairs.filter((_, i) => i !== index);
        setEnvPairs(updated);
        setRawText(updated.map(p => `${p.key}=${p.value}`).join('\n'));
        if (activeTab === 'global') {
          setGlobalEnvPairs(updated);
        }
      };

      const handleCopyKey = (key) => {
        navigator.clipboard.writeText(key);
        setCopiedKey(key);
        setTimeout(() => setCopiedKey(''), 1500);
      };

      const handleCopyAllEnv = () => {
        if (envPairs.length === 0) {
          alert('Không có biến nào để sao chép!');
          return;
        }
        const text = envPairs.map(p => `${p.key}=${p.value}`).join('\n');
        navigator.clipboard.writeText(text);
        setSaveStatus(`✔ Đã sao chép ${envPairs.length} biến .env vào Clipboard!`);
        setTimeout(() => setSaveStatus(''), 2500);
      };

      const handleApplyCopiedEnv = (sourceEnv, mode = 'overwrite') => {
        const sourcePairs = Object.entries(sourceEnv).map(([key, value]) => ({
          key,
          value: String(value)
        }));

        let newPairs;
        if (mode === 'overwrite') {
          newPairs = sourcePairs;
        } else {
          const map = new Map(envPairs.map(p => [p.key, p.value]));
          for (const [k, v] of Object.entries(sourceEnv)) {
            map.set(k, String(v));
          }
          newPairs = Array.from(map.entries()).map(([key, value]) => ({ key, value }));
        }

        setEnvPairs(newPairs);
        setRawText(newPairs.map(p => `${p.key}=${p.value}`).join('\n'));
        if (activeTab === 'global') {
          setGlobalEnvPairs(newPairs);
        }
        setShowCopyFromModal(false);
        setSaveStatus(`✔ Đã sao chép ${sourcePairs.length} biến thành công! (Bấm Lưu để ghi lại)`);
        setTimeout(() => setSaveStatus(''), 3500);
      };

      const handleSave = async (restart = false) => {
        const overrides = {};
        for (const p of envPairs) {
          overrides[p.key] = p.value;
        }

        if (activeTab === 'global') {
          const res = await fetch('/api/global-env', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ globalVars: overrides, profileKey: activeGlobalProfile })

          const data = await res.json();
          if (data.success) {
            if (data.globalProfiles) setGlobalProfiles(data.globalProfiles);
            setGlobalEnvPairs(envPairs);
            setSaveStatus(`✔ Đã lưu cấu hình Global Profile "${activeGlobalProfile}" & Tự động áp dụng cho các microservices!`);
          }
          setTimeout(() => setSaveStatus(''), 3000);
          return;
        }

        await onSaveOverrides(activeTab, overrides);
        if (restart && currentService?.statusInfo?.status === 'RUNNING') {
          await onRestartService(activeTab);
          setSaveStatus('✔ Đã lưu cấu hình & Đang Restart service!');
        } else {
          setSaveStatus('✔ Đã lưu cấu hình thành công!');
        }
        setTimeout(() => setSaveStatus(''), 2500);
      };

      const handleCreateNewProfile = async () => {
        if (!newProfileKey.trim()) return;
        const key = newProfileKey.trim().toLowerCase().replace(/\s+/g, '-');
        const overrides = {};
        for (const p of envPairs) {
          overrides[p.key] = p.value;
        }

        if (activeTab === 'global') {
          const res = await fetch('/api/global-env/custom-profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profileKey: key, profileData: { name: newProfileName || key, env: overrides } })
          });
          const data = await res.json();
          if (data.success) {
            setActiveGlobalProfile(data.activeGlobalProfile);
            if (data.globalProfiles) setGlobalProfiles(data.globalProfiles);
            const pairs = Object.entries(data.globalEnv || {}).map(([k, v]) => ({ key: k, value: String(v) }));
            setGlobalEnvPairs(pairs);
            setEnvPairs(pairs);
            setRawText(pairs.map(p => `${p.key}=${p.value}`).join('\n'));
            setSaveStatus(`✔ Đã tạo global profile "${key}" & Tự động thêm profile vào tất cả các services!`);
            setTimeout(() => setSaveStatus(''), 3500);
          }
        } else {
          await onCreateProfile(activeTab, key, {
            name: newProfileName || key,
            description: `Profile ${key}`,
            env: overrides
          });
          await onChangeProfile(activeTab, key);
        }
        setShowNewProfileModal(false);
        setNewProfileKey('');
        setNewProfileName('');
      };

      const handleDeleteProfileClick = async (profileKey) => {
        if (activeTab === 'global') {
          if (profileKey === 'default') {
            alert('Không thể xóa profile default!');
            return;
          }
          if (!confirm(`Bạn có chắc chắn muốn xóa global profile "${profileKey}" không?`)) return;
          try {
            const res = await fetch(`/api/global-env/custom-profile/${profileKey}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
              setActiveGlobalProfile(data.activeGlobalProfile);
              if (data.globalProfiles) setGlobalProfiles(data.globalProfiles);
              const pairs = Object.entries(data.globalEnv || {}).map(([k, v]) => ({ key: k, value: String(v) }));
              setGlobalEnvPairs(pairs);
              setEnvPairs(pairs);
              setRawText(pairs.map(p => `${p.key}=${p.value}`).join('\n'));
              setSaveStatus(`✔ Đã xóa global profile "${profileKey}" thành công!`);
              setTimeout(() => setSaveStatus(''), 2500);

            alert('Lỗi: ' + e.message);
          }
          return;
        }

        if (!confirm(`Bạn có chắc chắn muốn xóa profile "${profileKey}" của ${currentService?.name}?`)) return;

          await onDeleteProfile(activeTab, profileKey);
          setSaveStatus(`✔ Đã xóa profile "${profileKey}" thành công!`);
          setTimeout(() => setSaveStatus(''), 2500);
        } catch (e) {
          alert('Lỗi: ' + e.message);
        }
      };

      const handleClearAllEnv = () => {

        setEnvPairs([]);

        if (activeTab === 'global') {
          setGlobalEnvPairs([]);

        setTimeout(() => setSaveStatus(''), 4000);

      const filteredPairs = useMemo(() => {

                    <span>➕</span>

                    <div className="relative flex items-center pr-3">
                      <select

                        onChange={(e) => onChangeProfile(activeTab, e.target.value)}
                        className="bg-transparent text-xs font-mono font-bold text-cyan-300 focus:outline-none cursor-pointer appearance-none"
                        title="Chọn Profile để chỉnh sửa"
                      >
                        {profileKeys.map(k => (
                          <option key={k} value={k} className="bg-[#0b101e] text-white">

                  <button

                    <span>➕</span>
                    <span>Thêm Profile</span>
                  </button>

                  {/* Delete Profile Button (for custom profile) */}
                  {activeProfileKey !== 'default' && (

                      className="px-2.5 py-1.5 bg-rose-950/30 hover:bg-rose-600 text-rose-400 hover:text-white text-xs font-semibold rounded-xl border border-rose-800/40 transition-all flex items-center space-x-1 flex-shrink-0 shadow-sm"
                      title={`Xóa profile "${activeProfileKey}"`}

                      <span>🗑️</span>
                      <span>Xóa Profile</span>
                    </button>

              {/* Actions Right */}
              <div className="flex flex-wrap items-center gap-2">

                  title="Sao chép toàn bộ biến .env vào Clipboard"
                >
                  <span>📋</span>
                  <span>Copy .env</span>

                  <span>Sao Chép Từ...</span>

                {/* Delete / Clear All Env Button */}
                <button

                  title="Xóa toàn bộ biến môi trường của profile này"
                >
                  <span>🗑️</span>
                  <span>Xóa Env</span>

                {activeTab !== 'global' && (

                <button

                  </div>
                  <textarea

                    value={rawText}
                    onChange={(e) => handleRawTextChange(e.target.value)}

                    className="w-full bg-[#050811] border border-slate-700 rounded-2xl p-5 text-xs font-mono text-slate-200 focus:outline-none focus:border-cyan-500 shadow-inner leading-relaxed selection:bg-cyan-700 selection:text-white"
                  />
                </div>
              )}

            </div>
          </div>

          {/* New Profile Modal */}
          {showNewProfileModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-6 animate-in fade-in">
              <div className="bg-[#0b101e] border border-slate-700 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h4 className="text-sm font-bold text-white font-mono">➕ Thêm Profile Mới Cho {currentService?.name}</h4>
                  <button onClick={() => setShowNewProfileModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1 font-mono">Mã Profile (Key, vd: dev, staging, prod, mock)</label>
                  <input
                    type="text"
                    placeholder="ví dụ: dev, staging, local-mock, prod"
                    value={newProfileKey}
                    onChange={(e) => setNewProfileKey(e.target.value)}
                    className="w-full bg-[#050811] border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-cyan-500 lowercase"
                  />

                <div>
                  <label className="text-xs text-slate-400 block mb-1 font-mono">Tên Hiển Thị (Display Name - Không bắt buộc)</label>
                  <input
                    type="text"
                    placeholder="ví dụ: Staging Remote DB"
                    value={newProfileName}
                    onChange={(e) => setNewProfileName(e.target.value)}

                <div className="flex justify-end space-x-3 pt-2">

                    Hủy

                    Tạo Profile

          {/* Copy from another profile / service modal */}
          {showCopyFromModal && (
            <CopyFromEnvModal
              isOpen={true}
              onClose={() => setShowCopyFromModal(false)}
              services={services}
              activeTab={activeTab}
              currentProfileKey={activeProfileKey}
              globalEnvPairs={globalEnvPairs}
              onApply={handleApplyCopiedEnv}
            />
          )}

        </div>
      );
    }

    // ================= COPY / CLONE ENV MODAL =================
    function CopyFromEnvModal({ isOpen, onClose, services = [], activeTab, currentProfileKey, globalEnvPairs = [], onApply }) {
      if (!isOpen) return null;

      // Available sources
      const sources = [
        { id: 'global', label: '🌍 Global Shared Config', env: Object.fromEntries(globalEnvPairs.map(p => [p.key, p.value])) },
        ...services.flatMap(s => {
          return Object.entries(s.profiles || {}).map(([pKey, pVal]) => ({
            id: `${s.id}:::${pKey}`,
            label: `🧩 ${s.name} (Profile: ${pKey})`,
            env: pVal?.env || {}
          }));
        })
      ].filter(src => {
        if (activeTab === 'global' && src.id === 'global') return false;
        if (src.id === `${activeTab}:::${currentProfileKey}`) return false;
        return true;
      });

      const [selectedSourceId, setSelectedSourceId] = useState(sources[0]?.id || '');
      const [copyMode, setCopyMode] = useState('overwrite'); // 'overwrite' | 'merge'

      const currentSource = sources.find(s => s.id === selectedSourceId);
      const sourceEnv = currentSource?.env || {};
      const sourceCount = Object.keys(sourceEnv).length;

      const handleConfirm = () => {
        if (!sourceEnv || Object.keys(sourceEnv).length === 0) {
          alert('Nguồn này không có biến môi trường nào để sao chép!');
          return;
        }
        onApply(sourceEnv, copyMode);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-in fade-in">
          <div className="bg-[#0b101e] border border-slate-700 rounded-2xl p-6 w-full max-w-lg space-y-4 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h4 className="text-sm font-bold text-white font-mono flex items-center gap-2">
                <span>📑 Sao Chép Biến Môi Trường (Copy Env)</span>
              </h4>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xs">✕</button>
            </div>

            <div>
              <label className="text-xs text-slate-300 block mb-1.5 font-bold">1. Chọn Nguồn Sao Chép (Source):</label>
              {sources.length === 0 ? (
                <div className="text-xs text-slate-400 italic bg-[#050811] p-3 rounded-xl border border-slate-800">
                  Không tìm thấy nguồn nào khác có biến môi trường để sao chép.
                </div>
              ) : (
                <select
                  value={selectedSourceId}
                  onChange={(e) => setSelectedSourceId(e.target.value)}
                  className="w-full bg-[#050811] border border-slate-700 rounded-xl px-3 py-2.5 text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-500"
                >
                  {sources.map(src => (
                    <option key={src.id} value={src.id}>
                      {src.label} ({Object.keys(src.env).length} biến)
                    </option>
                  ))}
                </select>
              )}
            </div>

            <div>
              <label className="text-xs text-slate-300 block mb-1.5 font-bold">2. Phương Thức Sao Chép (Mode):</label>
              <div className="grid grid-cols-2 gap-2">
                <div
                  onClick={() => setCopyMode('overwrite')}
                  className={`p-3 rounded-xl border cursor-pointer transition-all ${
                    copyMode === 'overwrite'
                      ? 'bg-indigo-950/80 border-indigo-500 text-white shadow-md'
                      : 'bg-[#050811] border-slate-800 text-slate-400 hover:border-slate-700'
                  }`}
                >
                  <span className="font-bold text-xs block text-white">Ghi Đè (Overwrite)</span>
                  <span className="text-[10px] text-slate-400 block mt-0.5">Thay thế toàn bộ biến hiện tại</span>
                </div>

                <div
                  onClick={() => setCopyMode('merge')}
                  className={`p-3 rounded-xl border cursor-pointer transition-all ${
                    copyMode === 'merge'
                      ? 'bg-purple-950/80 border-purple-500 text-white shadow-md'
                      : 'bg-[#050811] border-slate-800 text-slate-400 hover:border-slate-700'
                  }`}
                >
                  <span className="font-bold text-xs block text-white">Gộp Thêm (Merge)</span>
                  <span className="text-[10px] text-slate-400 block mt-0.5">Giữ biến cũ, thêm biến mới</span>
                </div>
              </div>
            </div>

            {/* Preview Keys */}
            <div className="bg-[#050811] p-3 rounded-xl border border-slate-800/80 space-y-1">
              <span className="text-[11px] text-slate-400 block font-mono">
                Xem trước: Sẽ sao chép <strong className="text-cyan-300">{sourceCount}</strong> biến môi trường:
              </span>
              <div className="max-h-24 overflow-y-auto text-[10px] font-mono text-slate-300 space-y-0.5 pr-1">
                {Object.keys(sourceEnv).length > 0 ? (
                  Object.keys(sourceEnv).map(k => (
                    <span key={k} className="inline-block bg-slate-800/80 px-1.5 py-0.5 rounded mr-1 mb-1 text-slate-300">
                      {k}
                    </span>
                  ))
                ) : (
                  <span className="text-slate-500 italic">Trống</span>
                )}
              </div>
            </div>

            <div className="flex justify-end space-x-3 pt-2 border-t border-slate-800">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 text-xs text-slate-400 hover:text-white bg-slate-800 rounded-xl"
              >
                Hủy
              </button>
              <button
                type="button"
                disabled={sourceCount === 0}
                onClick={handleConfirm}
                className="px-5 py-2 text-xs font-bold text-white bg-purple-600 hover:bg-purple-500 disabled:opacity-50 rounded-xl shadow-lg shadow-purple-900/30 flex items-center space-x-1.5"
              >
                <span>📑</span>
                <span>Áp Dụng Sao Chép</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ================= BACKUP & RESTORE MODAL =================
    function BackupRestoreModal({ isOpen, onClose, onReloadAll }) {
      if (!isOpen) return null;

      const [activeTab, setActiveTab] = React.useState('export'); // 'export' | 'import'
      const [importFile, setImportFile] = React.useState(null);
      const [importData, setImportData] = React.useState(null);
      const [inspection, setInspection] = React.useState(null);
      const [importMode, setImportMode] = React.useState('merge'); // 'merge' | 'overwrite'
      const [currentStats, setCurrentStats] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [errorMsg, setErrorMsg] = React.useState('');
      const [successMsg, setSuccessMsg] = React.useState('');

      // Load current stats for export tab
      React.useEffect(() => {
        fetch('/api/export/all')
          .then(r => r.json())
          .then(data => {
            fetch('/api/config/inspect', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data })
            })
              .then(r => r.json())
              .then(res => {
                if (res.success) setCurrentStats(res);
              });
          })
          .catch(e => {});
      }, [isOpen]);

      // Handle File Selection
      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setImportFile(file);
        setErrorMsg('');
        setSuccessMsg('');
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            setImportData(parsed);
            // Inspect
            const res = await fetch('/api/config/inspect', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: parsed })
            });
            const data = await res.json();
            if (data.success) {
              setInspection(data);
            } else {
              setErrorMsg(data.error || 'File JSON không hợp lệ');
            }
          } catch (err) {
            setErrorMsg('Lỗi đọc file JSON: ' + err.message);
          }
        };
        reader.readAsText(file);
      };

      const handleExecuteImport = async () => {
        if (!importData) {
          setErrorMsg('Vui lòng chọn file backup JSON!');
          return;
        }
        if (importMode === 'overwrite') {
          if (!confirm('⚠️ CẢNH BÁO: Chế độ GHI ĐÈ sẽ thay thế toàn bộ Services, Danh mục, Scripts và ENV hiện tại. Bạn có chắc chắn muốn tiếp tục?')) {
            return;
          }
        }
        try {
          setLoading(true);
          setErrorMsg('');
          setSuccessMsg('');
          const res = await fetch('/api/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: importData, mode: importMode })
          });
          const data = await res.json();
          if (data.success) {
            setSuccessMsg(`Khôi phục thành công! Đã nạp ${data.servicesCount || 0} services, ${data.categoriesCount || 0} danh mục, ${data.scriptsCount || 0} scripts.`);
            if (onReloadAll) await onReloadAll();
            setTimeout(() => {
              onClose();
            }, 1800);
          } else {
            setErrorMsg(data.error || 'Khôi phục thất bại');
          }
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleDownloadExport = () => {
        window.open('/api/export/all', '_blank');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
          <div className="bg-[#0b101e] border border-slate-700/80 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col max-h-[92vh]">
            
            {/* Header */}
            <div className="p-4 bg-[#070b15] border-b border-slate-800 flex items-center justify-between flex-shrink-0">
              <div className="flex items-center space-x-2.5">
                <span className="text-2xl">📦</span>
                <div>
                  <h3 className="text-base font-bold text-white">Sao Lưu & Khôi Phục Toàn Bộ Dữ Liệu</h3>
                  <p className="text-[11px] text-slate-400">Xuất hoặc nhập toàn bộ ENV, Danh mục, Services và Custom Scripts (JSON v2.0)</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800">✕</button>
            </div>

            {/* Tab Switcher */}
            <div className="flex border-b border-slate-800 bg-[#080d19] px-4 pt-2 flex-shrink-0">
              <button
                type="button"
                onClick={() => { setActiveTab('export'); setErrorMsg(''); setSuccessMsg(''); }}
                className={`pb-2.5 px-4 text-xs font-bold border-b-2 flex items-center space-x-2 transition-all ${
                  activeTab === 'export'
                    ? 'border-emerald-500 text-emerald-400'
                    : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>💾</span>
                <span>Xuất Dữ Liệu (Backup)</span>
              </button>
              <button
                type="button"
                onClick={() => { setActiveTab('import'); setErrorMsg(''); setSuccessMsg(''); }}
                className={`pb-2.5 px-4 text-xs font-bold border-b-2 flex items-center space-x-2 transition-all ${
                  activeTab === 'import'
                    ? 'border-blue-500 text-blue-400'
                    : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>📥</span>
                <span>Khôi Phục (Restore)</span>
              </button>
            </div>

            {/* Content Body */}
            <div className="p-6 space-y-5 overflow-y-auto flex-1">
              
              {/* Tab Export */}
              {activeTab === 'export' && (
                <div className="space-y-4">
                  <div className="p-4 bg-[#070b15] rounded-xl border border-slate-800 space-y-3">
                    <span className="text-xs font-bold text-slate-200 block">📊 Tổng Hợp Dữ Liệu Sẽ Xuất:</span>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      <div className="p-3 bg-[#0d1424] rounded-lg border border-slate-800 text-center">
                        <span className="text-lg block">⚙️</span>
                        <span className="text-xs text-slate-400 block mt-1">Services</span>
                        <span className="text-sm font-mono font-bold text-emerald-400">{currentStats ? currentStats.servicesCount : '...'}</span>
                      </div>
                      <div className="p-3 bg-[#0d1424] rounded-lg border border-slate-800 text-center">
                        <span className="text-lg block">🏷️</span>
                        <span className="text-xs text-slate-400 block mt-1">Danh Mục</span>
                        <span className="text-sm font-mono font-bold text-purple-400">{currentStats ? currentStats.categoriesCount : '...'}</span>
                      </div>
                      <div className="p-3 bg-[#0d1424] rounded-lg border border-slate-800 text-center">
                        <span className="text-lg block">📜</span>
                        <span className="text-xs text-slate-400 block mt-1">Scripts</span>
                        <span className="text-sm font-mono font-bold text-amber-400">{currentStats ? currentStats.scriptsCount : '...'}</span>
                      </div>
                      <div className="p-3 bg-[#0d1424] rounded-lg border border-slate-800 text-center">
                        <span className="text-lg block">🌿</span>
                        <span className="text-xs text-slate-400 block mt-1">Env Profiles</span>
                        <span className="text-sm font-mono font-bold text-cyan-400">
                          {currentStats?.envSummary ? `${currentStats.envSummary.totalProfilesCount || 0} profiles` : '...'}
                        </span>
                        <span className="text-[10px] text-slate-500 font-mono block">
                          {currentStats?.envSummary ? `${currentStats.envSummary.totalEnvVars || 0} biến ENV` : ''}
                        </span>
                      </div>
                    </div>
                  </div>

                  <div className="p-4 bg-emerald-950/20 border border-emerald-800/40 rounded-xl space-y-2">
                    <h4 className="text-xs font-bold text-emerald-300 flex items-center space-x-1.5">
                      <span>✨</span>
                      <span>Bản sao lưu chuẩn JSON 100% độc lập</span>
                    </h4>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      File tải về chứa đầy đủ toàn bộ cấu hình biến môi trường đa môi trường (Local/Dev/UAT/Prod), danh mục phân loại, danh sách microservices và custom scripts. Bạn có thể lưu giữ hoặc chuyển sang máy khác dễ dàng.
                    </p>
                  </div>

                  <button
                    type="button"
                    onClick={handleDownloadExport}
                    className="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-emerald-950/50 flex items-center justify-center space-x-2 transition-all"
                  >
                    <span>💾</span>
                    <span>Tải Về File Backup Toàn Bộ (.json)</span>
                  </button>
                </div>
              )}

              {/* Tab Import */}
              {activeTab === 'import' && (
                <div className="space-y-4">
                  {/* File Upload Input */}
                  <div className="p-5 border-2 border-dashed border-slate-700 hover:border-cyan-500 bg-[#070b15] rounded-xl text-center cursor-pointer transition-colors relative">
                    <input
                      type="file"
                      accept=".json"
                      onChange={handleFileChange}
                      className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                    />
                    <span className="text-3xl block mb-2">📁</span>
                    <span className="text-xs font-bold text-white block">
                      {importFile ? importFile.name : 'Nhấp vào đây hoặc kéo thả file backup .json'}
                    </span>
                    <span className="text-[11px] text-slate-400 block mt-1">Hỗ trợ các file backup JSON v1.0 và v2.0</span>
                  </div>

                  {/* Inspection Preview */}
                  {inspection && (
                    <div className="p-4 bg-[#0d1424] rounded-xl border border-cyan-800/50 space-y-3 animate-fadeIn">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                        <span className="text-xs font-bold text-cyan-300 flex items-center space-x-1.5">
                          <span>🔍</span>
                          <span>Xem Trước Nội Dung File:</span>
                        </span>
                        <span className="text-[10px] font-mono text-slate-400">
                          {inspection.exportedAt ? `Xuất lúc: ${new Date(inspection.exportedAt).toLocaleString()}` : 'Format chuẩn'}
                        </span>
                      </div>

                      <div className="grid grid-cols-4 gap-2 text-center text-xs">
                        <div className="p-2 bg-[#070b15] rounded-lg">
                          <span className="text-slate-400 block text-[10px]">Services</span>
                          <span className="font-bold text-emerald-400 font-mono text-sm">{inspection.servicesCount}</span>
                        </div>
                        <div className="p-2 bg-[#070b15] rounded-lg">
                          <span className="text-slate-400 block text-[10px]">Danh Mục</span>
                          <span className="font-bold text-purple-400 font-mono text-sm">{inspection.categoriesCount}</span>
                        </div>
                        <div className="p-2 bg-[#070b15] rounded-lg">
                          <span className="text-slate-400 block text-[10px]">Scripts</span>
                          <span className="font-bold text-amber-400 font-mono text-sm">{inspection.scriptsCount}</span>
                        </div>
                        <div className="p-2 bg-[#070b15] rounded-lg">
                          <span className="text-slate-400 block text-[10px]">Env Profiles</span>
                          <span className="font-bold text-cyan-400 font-mono text-sm">
                            {inspection.envSummary?.totalProfilesCount || 0}
                          </span>
                          <span className="text-[9px] text-slate-500 font-mono block">
                            {inspection.envSummary?.totalEnvVars || 0} biến
                          </span>
                        </div>
                      </div>

                      {/* Mode Selector */}
                      <div className="space-y-2 pt-2 border-t border-slate-800">
                        <label className="text-xs font-semibold text-slate-300 block">Chọn chế độ khôi phục:</label>
                        <div className="grid grid-cols-2 gap-3">
                          <button
                            type="button"
                            onClick={() => setImportMode('merge')}
                            className={`p-3 rounded-xl border text-left transition-all ${
                              importMode === 'merge'
                                ? 'bg-blue-950/40 border-blue-500 text-white'
                                : 'bg-[#070b15] border-slate-800 text-slate-400 hover:text-slate-200'
                            }`}
                          >
                            <div className="flex items-center space-x-1.5 font-bold text-xs text-blue-400 mb-1">
                              <span>➕</span>
                              <span>Gộp Thêm (Merge)</span>
                            </div>
                            <p className="text-[11px] text-slate-400 leading-tight">
                              Giữ nguyên dữ liệu hiện tại, bổ sung thêm các service, danh mục, script mới.
