                          </button>

                          <button
                            type="button"
                            onClick={() => setImportMode('overwrite')}
                            className={`p-3 rounded-xl border text-left transition-all ${
                              importMode === 'overwrite'
                                ? 'bg-rose-950/40 border-rose-500 text-white'
                                : 'bg-[#070b15] border-slate-800 text-slate-400 hover:text-slate-200'
                            }`}
                          >
                            <div className="flex items-center space-x-1.5 font-bold text-xs text-rose-400 mb-1">
                              <span>🔄</span>
                              <span>Ghi Đè Toàn Bộ (Overwrite)</span>
                            </div>
                            <p className="text-[11px] text-slate-400 leading-tight">
                              Xóa toàn bộ cấu hình cũ và khôi phục 100% trạng thái chính xác từ file backup.
                            </p>
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {errorMsg && (
                    <div className="p-3 bg-rose-950/40 border border-rose-800/60 rounded-xl text-xs text-rose-300">
                      ⚠ {errorMsg}
                    </div>
                  )}

                  {successMsg && (
                    <div className="p-3 bg-emerald-950/40 border border-emerald-800/60 rounded-xl text-xs text-emerald-300">
                      ✔ {successMsg}
                    </div>
                  )}

                  <button
                    type="button"
                    disabled={!importData || loading}
                    onClick={handleExecuteImport}
                    className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold rounded-xl text-xs shadow-lg shadow-blue-950/50 flex items-center justify-center space-x-2 transition-all"
                  >
                    <span>🚀</span>
                    <span>{loading ? 'Đang khôi phục...' : `Khôi Phục Dữ Liệu (${importMode === 'merge' ? 'Gộp thêm' : 'Ghi đè'})`}</span>
                  </button>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    // ================= GLOBAL SCRIPT MODAL =================
    function GlobalScriptModal({ script, services = [], workspaceRoot = '', isOpen, onClose, onSave }) {
      if (!isOpen) return null;

      const [name, setName] = React.useState(script ? script.name : '');
      const [command, setCommand] = React.useState(script ? script.command : '');
      const [icon, setIcon] = React.useState(script ? script.icon : '⚡');
      const [cwdType, setCwdType] = React.useState(script ? script.cwdType || 'workspace' : 'workspace');
      const [customCwd, setCustomCwd] = React.useState(script ? script.cwd || '' : workspaceRoot);
      const [selectedFile, setSelectedFile] = React.useState(script ? script.file || '' : '');
      const [rawEnv, setRawEnv] = React.useState(script ? script.rawEnv || '' : '');
      const [detectedEnv, setDetectedEnv] = React.useState(null);
      const [browsing, setBrowsing] = React.useState(false);
      const [errorMsg, setErrorMsg] = React.useState('');
      const [saving, setSaving] = React.useState(false);

      // Current effective CWD
      const effectiveCwd = cwdType === 'workspace'
        ? workspaceRoot
        : cwdType === 'custom'
        ? customCwd
        : (services.find(s => s.id === cwdType)?.cwd || workspaceRoot);

      // Inspect detected ENV whenever CWD or Service changes
      React.useEffect(() => {
        setDetectedEnv(null);
        fetch('/api/scripts/inspect-env', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cwd: effectiveCwd, cwdType })
        })
          .then(r => r.json())
          .then(data => {
            if (data.success) setDetectedEnv(data);
          })
          .catch(e => {});
      }, [effectiveCwd, cwdType]);

      // Handle Browse File via Finder
      const handleBrowseFile = async () => {
        try {
          setBrowsing(true);
          setErrorMsg('');
          const res = await fetch('/api/browse-file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: 'Chọn file script (.sh, .ts, .js, .py):',
              defaultDir: effectiveCwd
            })
          });
          const data = await res.json();
          if (data.success) {
            setSelectedFile(data.filename);
            setCommand(data.suggestedCommand || `bash ${data.relativePath || data.filename}`);
            if (!name) setName(data.filename.replace(/\.[^/.]+$/, ''));
          }
        } catch (e) {
          setErrorMsg('Lỗi khi mở Finder: ' + e.message);
        } finally {
          setBrowsing(false);
        }
      };

      // Quick Runner setter
      const handleSetRunner = (runner) => {
        if (!selectedFile && !command) {
          setCommand(`${runner} `);
          return;
        }
        const filePart = selectedFile || command.split(' ').slice(1).join(' ') || '';
        setCommand(`${runner} ${filePart}`);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!command.trim()) {
          setErrorMsg('Vui lòng nhập lệnh thực thi!');
          return;
        }
        try {
          setSaving(true);
          setErrorMsg('');
          await onSave({
            id: script?.id,
            name: name.trim() || selectedFile || command.trim(),
            command: command.trim(),
            icon,
            cwdType,
            cwd: effectiveCwd,
            file: selectedFile,
            rawEnv: rawEnv.trim()
          });
          onClose();
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
          <div className="bg-[#0b101e] border border-slate-700/80 rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl flex flex-col max-h-[92vh]">
            
            {/* Header */}
            <div className="p-4 bg-[#070b15] border-b border-slate-800 flex items-center justify-between flex-shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📜</span>
                <h3 className="text-base font-bold text-white">
                  {script ? 'Chỉnh Sửa Custom Script' : 'Thêm Custom Script Mới'}
                </h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">✕</button>
            </div>

            {/* Form with scrollable body */}
            <form onSubmit={handleSubmit} className="p-5 space-y-4 overflow-y-auto flex-1">
              
              {/* Thư mục chạy */}
              <div>
                <label className="text-xs font-semibold text-slate-300 block mb-1">
                  Thư mục làm việc (CWD) & Gắn ENV <span className="text-rose-400">*</span>
                </label>
                <select
                  value={cwdType}
                  onChange={(e) => setCwdType(e.target.value)}
                  className="w-full bg-[#070b15] border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-500 cursor-pointer"
                >
                  <option value="workspace">📁 Thư mục gốc Workspace ({workspaceRoot})</option>
                  {services.map(s => (
                    <option key={s.id} value={s.id}>⚙️ Service: {s.name} ({s.cwd})</option>
                  ))}
                  <option value="custom">📁 Thư mục tùy chỉnh...</option>
                </select>
                {cwdType === 'custom' && (
                  <input
                    type="text"
                    value={customCwd}
                    onChange={(e) => setCustomCwd(e.target.value)}
                    placeholder="/path/to/directory"
                    className="w-full mt-1.5 bg-[#070b15] border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-mono text-slate-300 focus:outline-none focus:border-cyan-500"
                  />
                )}
              </div>

              {/* Auto-Detected ENV Banner */}
              <div className="p-3 bg-[#08101e] rounded-xl border border-slate-800/80 space-y-1">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-emerald-400 flex items-center space-x-1.5">
                    <span>🌿</span>
                    <span>Tự Động Nạp Biến Môi Trường (ENV):</span>
                  </span>
                  <span className="text-[11px] font-mono font-bold text-cyan-300 px-2.5 py-0.5 rounded-full bg-cyan-950/60 border border-cyan-800/40">
                    {detectedEnv ? `${detectedEnv.count} biến ENV` : 'Đang kiểm tra...'}
                  </span>
                </div>
                <p className="text-[11px] text-slate-400">
                  {detectedEnv?.source === 'service'
                    ? `Kế thừa từ Service "${detectedEnv.serviceName}" (Active Profile: ${detectedEnv.profile})`
                    : detectedEnv?.source === 'file'
                    ? `Tìm thấy file ${detectedEnv.fileName} tại thư mục chứa script`
                    : `Kế thừa từ cấu hình biến môi trường toàn cục (Global Env)`
                  }
                </p>
              </div>

              {/* Chọn File Từ Finder */}
              <div className="p-3 bg-[#10172a] rounded-xl border border-slate-800 flex items-center justify-between">
                <div>
                  <span className="text-xs font-bold text-white block">Chọn File Script</span>
                  <span className="text-[11px] text-slate-400 block">
                    {selectedFile ? `Đã chọn: ${selectedFile}` : 'Chọn file .sh, .ts, .js, .py từ máy'}
                  </span>
                </div>
                <button
                  type="button"
                  disabled={browsing}
                  onClick={handleBrowseFile}
                  className="px-3.5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-500 rounded-lg shadow-md shadow-blue-950/40 flex items-center space-x-1.5 transition-all"
                >
                  <span>📁</span>
                  <span>{browsing ? 'Đang mở...' : 'Chọn File Finder'}</span>
                </button>
              </div>

              {/* Quick Runner Chips */}
              <div>
                <label className="text-[11px] font-semibold text-slate-400 block mb-1">
                  Chọn Runner thực thi nhanh:
                </label>
                <div className="flex flex-wrap gap-1.5">
                  {['bash', 'sh', './', 'node', 'pnpm ts-node', 'pnpm', 'python3'].map(r => (
                    <button
                      key={r}
                      type="button"
                      onClick={() => handleSetRunner(r)}
                      className="px-2.5 py-1 text-xs font-mono rounded-md bg-slate-800 text-cyan-300 border border-slate-700 hover:bg-slate-700 hover:border-cyan-500 transition-colors"
                    >
                      {r}
                    </button>
                  ))}
                </div>
              </div>

              {/* Lệnh Command */}
              <div>
                <label className="text-xs font-semibold text-slate-300 block mb-1">
                  Lệnh thực thi (Command) <span className="text-rose-400">*</span>
                </label>
                <input
                  type="text"
                  value={command}
                  onChange={(e) => setCommand(e.target.value)}
                  placeholder="e.g. bash ./a.sh hoặc pnpm test"
                  className="w-full bg-[#070b15] border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono text-cyan-200 focus:outline-none focus:border-cyan-500"
                />
              </div>

              {/* Custom ENV Textarea */}
              <div>
                <div className="flex items-center justify-between mb-1">
                  <label className="text-xs font-semibold text-slate-300">
                    🔧 Biến Môi Trường Bổ Sung / Ghi Đè (Tùy chọn)
                  </label>
                  <span className="text-[10px] text-slate-500 font-mono">KEY=VALUE (mỗi biến 1 dòng)</span>
                </div>
                <textarea
                  value={rawEnv}
                  onChange={(e) => setRawEnv(e.target.value)}
                  rows={3}
                  placeholder={`# Thêm hoặc ghi đè biến riêng cho script này\nDEBUG=true\nSTAGE=staging\nCUSTOM_VAR=sample_value`}
                  className="w-full bg-[#070b15] border border-slate-700 rounded-lg p-2.5 text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-500 placeholder:text-slate-600"
                />
              </div>

              {/* Tên & Icon */}
              <div className="grid grid-cols-4 gap-3">
                <div className="col-span-1">
                  <label className="text-xs font-semibold text-slate-300 block mb-1">Icon</label>
                  <input
                    type="text"
                    value={icon}
                    onChange={(e) => setIcon(e.target.value)}
                    className="w-full bg-[#070b15] border border-slate-700 rounded-lg px-2 py-2 text-center text-sm focus:outline-none focus:border-cyan-500"
                  />
                </div>
                <div className="col-span-3">
                  <label className="text-xs font-semibold text-slate-300 block mb-1">Tên nút hiển thị</label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="e.g. Run A.sh"
                    className="w-full bg-[#070b15] border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500"
                  />
                </div>
              </div>

              {errorMsg && (
                <div className="p-2.5 bg-rose-950/40 border border-rose-800/60 rounded-lg text-xs text-rose-300">
                  ⚠ {errorMsg}
                </div>
              )}

              {/* Footer */}
              <div className="flex justify-end space-x-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold"
                >
                  Hủy
                </button>
                <button
                  type="submit"
                  disabled={saving || !command.trim()}
                  className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-950/40 flex items-center space-x-1.5"
                >
                  <span>💾</span>
                  <span>{saving ? 'Đang lưu...' : 'Lưu Script'}</span>
                </button>
              </div>

            </form>
          </div>
        </div>
      );
    }

    // ================= SCRIPTS MANAGER PAGE =================
    function ScriptsManagerPage({ services = [] }) {
      const [scripts, setScripts] = React.useState([]);
      const [workspaceRoot, setWorkspaceRoot] = React.useState('');
      const [loading, setLoading] = React.useState(true);
      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [editingScript, setEditingScript] = React.useState(null);

      // Terminal Logs State for Scripts
      const [scriptLogs, setScriptLogs] = React.useState([]);
      const [activeRunningTask, setActiveRunningTask] = React.useState(null);

      const fetchScripts = async () => {
        try {
          setLoading(true);
          const res = await fetch('/api/scripts');
          const data = await res.json();
          if (data.success) {
            setScripts(data.scripts || []);
            setWorkspaceRoot(data.workspaceRoot || '');
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      React.useEffect(() => {
        fetchScripts();

        const eventSource = new EventSource('/api/events');
        eventSource.addEventListener('task-start', (e) => {
          const data = JSON.parse(e.data);
          setActiveRunningTask(data.task);
          setScriptLogs(prev => [...prev, { text: `\x1b[36m➜ [${new Date().toLocaleTimeString()}] Bắt đầu: ${data.task}\x1b[0m\n`, timestamp: Date.now() }]);
        });

        eventSource.addEventListener('task-log', (e) => {
          const data = JSON.parse(e.data);
          setScriptLogs(prev => [...prev, { text: data.text, timestamp: Date.now() }]);
        });

        eventSource.addEventListener('task-finish', (e) => {
          const data = JSON.parse(e.data);
          setActiveRunningTask(null);
          setScriptLogs(prev => [...prev, { text: data.success ? `\x1b[32m✔ [${new Date().toLocaleTimeString()}] Hoàn thành: ${data.task}\x1b[0m\n\n` : `\x1b[31m✖ [${new Date().toLocaleTimeString()}] Thất bại: ${data.task} (${data.error || 'Unknown error'})\x1b[0m\n\n`, timestamp: Date.now() }]);
        });

        return () => eventSource.close();
      }, []);

      const handleSaveScript = async (scriptData) => {
        const res = await fetch('/api/scripts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(scriptData)
        });
        const data = await res.json();
        if (data.success) {
          setScripts(data.scripts || []);
        } else {
          throw new Error(data.error || 'Lưu thất bại');
        }
      };

      const handleDeleteScript = async (scriptId) => {
        if (!confirm('Bạn có chắc chắn muốn xóa custom script này?')) return;
        try {
          const res = await fetch(`/api/scripts/${encodeURIComponent(scriptId)}`, { method: 'DELETE' });
          const data = await res.json();
          if (data.success) {
            setScripts(data.scripts || []);
          }
        } catch (e) {
          alert('Lỗi khi xóa: ' + e.message);
        }
      };

      const handleRunScript = async (script) => {
        try {
          const res = await fetch(`/api/scripts/${encodeURIComponent(script.id)}/run`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(script)
          });
          const data = await res.json();
          if (!data.success) {
            alert('Lỗi: ' + (data.error || 'Không thể chạy script'));
          }
        } catch (e) {
          alert('Lỗi kết nối: ' + e.message);
        }
      };

      return (
        <div className="flex-1 flex flex-col p-6 max-w-[1900px] mx-auto w-full h-[calc(100vh-80px)] overflow-hidden">
          
          {/* Top Header */}
          <div className="flex items-center justify-between pb-5 border-b border-slate-800/80 mb-6 flex-shrink-0">
            <div>
              <div className="flex items-center space-x-3">
                <span className="text-2xl">📜</span>
                <h1 className="text-xl font-bold text-white tracking-wide">Quản Lý & Thực Thi Custom Scripts</h1>
                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">
                  {scripts.length} Scripts
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                Tạo và chạy các file shell script (.sh), ts, js, python độc lập với 1 cú click và xem live console log
              </p>
            </div>

            <div className="flex items-center space-x-3">
              <button
                onClick={fetchScripts}
                className="px-3.5 py-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-xl border border-slate-700 transition-colors flex items-center space-x-1.5"
              >
                <span>🔄</span>
                <span>Làm Mới</span>
              </button>

              <button
                onClick={() => {
                  setEditingScript(null);
                  setIsModalOpen(true);
                }}
                className="px-4 py-2 text-xs font-bold text-white bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 rounded-xl shadow-lg shadow-orange-950/40 flex items-center space-x-1.5 transition-all"
              >
                <span>➕</span>
                <span>Thêm Script Mới</span>
              </button>
            </div>
          </div>

          {/* 2-Column Responsive Layout */}
          <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-0 overflow-hidden">
            
            {/* Left Column: Script Cards List (5 Cols) */}
            <div className="lg:col-span-5 flex flex-col space-y-3 overflow-y-auto pr-1">
              {loading ? (
                <div className="p-8 text-center text-xs text-slate-500">Đang tải danh sách script...</div>
              ) : scripts.length === 0 ? (
                <div className="p-8 bg-[#0b101e] rounded-2xl border border-slate-800 text-center flex flex-col items-center justify-center space-y-3">
                  <span className="text-4xl">🐚</span>
                  <span className="text-sm font-bold text-white">Chưa Có Custom Script Nào</span>
                  <p className="text-xs text-slate-400 max-w-sm">
                    Hãy bấm nút "Thêm Script Mới" để chọn file script từ máy (.sh, .ts, .js) và tạo nút chạy 1-click!
                  </p>
                  <button
                    onClick={() => {
                      setEditingScript(null);
                      setIsModalOpen(true);
                    }}
                    className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs rounded-xl shadow-md"
                  >
                    ➕ Thêm Script Đầu Tiên
                  </button>
                </div>
              ) : (
                scripts.map(s => (
                  <div
                    key={s.id}
                    className="p-4 bg-[#0b101e] border border-slate-800 hover:border-slate-700 rounded-2xl transition-all flex flex-col space-y-3 shadow-lg"
                  >
                    <div className="flex items-start justify-between">
                      <div className="flex items-center space-x-3">
                        <span className="text-2xl p-2.5 rounded-xl bg-amber-950/40 border border-amber-800/40">{s.icon || '⚡'}</span>
                        <div>
                          <h4 className="text-sm font-bold text-white">{s.name}</h4>
                          <code className="text-xs font-mono text-cyan-300 block mt-0.5">{s.command}</code>
                        </div>
                      </div>

                      <div className="flex items-center space-x-1">
                        <button
                          onClick={() => {
                            setEditingScript(s);
                            setIsModalOpen(true);
                          }}
                          className="p-1.5 text-slate-400 hover:text-cyan-400 hover:bg-slate-800 rounded-lg transition-colors"
                          title="Chỉnh sửa"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                        </button>
                        <button
                          onClick={() => handleDeleteScript(s.id)}
                          className="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-950/40 rounded-lg transition-colors"
                          title="Xóa"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                      </div>
                    </div>

                    <div className="flex items-center justify-between pt-2 border-t border-slate-800/60 text-xs">
                      <div className="flex items-center space-x-2 overflow-hidden">
                        <span className="text-slate-400 font-mono text-[11px] truncate max-w-[180px]" title={s.cwd}>
                          📁 {s.cwd ? (s.cwd === workspaceRoot ? 'Workspace Root' : s.cwd.split('/').slice(-2).join('/')) : 'Workspace Root'}
                        </span>
                        {s.rawEnv ? (
                          <span className="px-1.5 py-0.5 text-[10px] font-bold rounded-md bg-emerald-950/40 text-emerald-300 border border-emerald-800/40 flex items-center space-x-0.5" title="Đã cấu hình thêm biến môi trường riêng">
                            <span>🌿</span>
                            <span>+ENV</span>
                          </span>
                        ) : (
                          <span className="px-1.5 py-0.5 text-[10px] font-medium rounded-md bg-slate-800/80 text-slate-400 border border-slate-700/60" title="Tự động nạp ENV từ thư mục hoặc Service Profile">
                            🌿 Auto ENV
                          </span>
                        )}
                      </div>

                      <button
                        onClick={() => handleRunScript(s)}
                        disabled={!!activeRunningTask}

                <div className="flex items-center space-x-2.5">
                  <span className="font-mono text-xs font-bold text-white">Scripts Console Output</span>
                  {activeRunningTask ? (
                    <span className="px-2 py-0.5 text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-full animate-pulse">

                  <button

    // ================= SERVICE GRID CARD =================
    function ServiceGridCard({

      logs = [],

      onStop,
      onRestart,
      onClearLogs,
      onOpenEnvModal,
      onChangeProfile,
      onTogglePopout,
      onRunServiceTask,
      onKillPort,
      onSelectConsole

      const status = service.statusInfo?.status || 'STOPPED';

      const isStarting = status === 'STARTING';
      const isStopping = status === 'STOPPING';
      const isRestarting = status === 'RESTARTING';
      const isError = status === 'ERROR';
      const isStopped = status === 'STOPPED';

      const profileKeys = Object.keys(service.profiles || {});

      const borderClass = isRunning

        ? 'border-orange-500/80 shadow-[0_0_20px_rgba(249,115,22,0.25)] bg-[#141018]'

                  <h3 className="font-mono text-base font-bold text-white tracking-wide">{service.name}</h3>
                  {service.isWsl && (

                      className="px-1.5 py-0.5 bg-purple-950/80 text-purple-300 border border-purple-600/40 rounded text-[10px] font-mono font-bold flex items-center space-x-1"
                      title={`WSL2 Distro: ${service.wslDistro || 'Ubuntu'} (${service.wslPath || service.cwd})`}

                      <span>WSL2</span>
                    </span>

                </div>
                
                {/* Profile Select Dropdown */}
                <select

              <div className="flex items-center space-x-1.5">

                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>
                <button
                  onClick={() => onTogglePopout(service)}
                  title="Phóng to Terminal"
                  className="p-1.5 text-slate-400 hover:text-cyan-400 hover:bg-slate-800 rounded-lg transition-colors"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                </button>
              </div>
            </div>

            {/* Badges Row with Enhanced Statuses */}
            <div className="flex flex-wrap items-center gap-2 text-xs">
              {isRunning ? (
                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                  Running {pid && `(PID: ${pid})`}
                </span>
              ) : isStarting ? (
                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">
                  <span className="w-2 h-2 rounded-full bg-amber-400 mr-2 animate-ping"></span>
                  Starting...
                </span>
              ) : isStopping ? (
                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full font-bold bg-orange-500/20 text-orange-300 border border-orange-500/40">
                  <span className="w-2 h-2 rounded-full bg-orange-400 mr-2"></span>
                  Stopping...
                </span>
              ) : isRestarting ? (
                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full font-bold bg-blue-500/20 text-blue-300 border border-blue-500/40 animate-pulse">
                  <span className="w-2 h-2 rounded-full bg-blue-400 mr-2"></span>
                  Restarting...
                </span>
              ) : isError ? (
                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full font-bold bg-rose-500/20 text-rose-400 border border-rose-500/40">
                  <span className="w-2 h-2 rounded-full bg-rose-400 mr-2"></span>
                  Error {service.statusInfo?.exitCode !== null && service.statusInfo?.exitCode !== undefined && `(Code: ${service.statusInfo.exitCode})`}
                </span>
              ) : (
                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full font-bold bg-slate-800 text-slate-400 border border-slate-700">
                  <span className="w-2 h-2 rounded-full bg-slate-500 mr-2"></span>
                  Stopped
                </span>
              )}

              <span className="px-2.5 py-0.5 rounded-md font-semibold bg-blue-950/80 text-blue-300 border border-blue-800/40">
                {service.category}
              </span>

              {service.port && (
                <span className="font-mono px-2.5 py-0.5 rounded-md font-semibold bg-purple-950/80 text-purple-300 border border-purple-800/40">
                  :{service.port}
                </span>
              )}

              <span className="font-mono text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-400">
                {service.activeProfile}
              </span>
            </div>

            {/* Action Buttons (Dedicated Start & Stop buttons always visible) */}
            <div className="flex items-center space-x-2 pt-1">
              <button
                disabled={isRunning || isStarting || isRestarting}
                onClick={() => onStart(service.id)}
                className={`flex-1 flex items-center justify-center space-x-1.5 py-2 px-3 rounded-xl text-xs font-bold transition-all ${
                  isRunning || isStarting || isRestarting
                    ? 'bg-slate-800/50 text-slate-500 cursor-not-allowed border border-slate-800'
                    : 'bg-blue-600 text-white hover:bg-blue-500 shadow-md shadow-blue-900/40'
                }`}
              >
                {isStarting ? (
                  <>
                    <svg className="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span>Starting...</span>
                  </>
                ) : (
                  <>
                    <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <span>Start</span>
                  </>
                )}
              </button>

              <button
                disabled={isStopped && !isError}
                onClick={() => onStop(service.id)}
                className={`flex-1 flex items-center justify-center space-x-1.5 py-2 px-3 rounded-xl text-xs font-bold transition-all ${
                  isStopped && !isError
                    ? 'bg-slate-800/40 text-slate-600 cursor-not-allowed border border-slate-800/60'
                    : 'bg-rose-600 text-white hover:bg-rose-500 shadow-md shadow-rose-950/40 border border-rose-500/50'
                }`}
              >
                {isStopping ? (
                  <>
                    <svg className="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span>Stopping...</span>
                  </>
                ) : (
                  <>
                    <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>
                    <span>Stop</span>
                  </>
                )}
              </button>

              <button
                onClick={() => onRestart(service.id)}
                className="flex items-center space-x-1 py-2 px-3 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all"
                title="Khởi động lại service"
              >
                <span>↺</span>
                <span>Restart</span>
              </button>

              <button
                onClick={() => onSelectConsole && onSelectConsole(service.id)}
                className="flex items-center space-x-1 py-2 px-3 rounded-xl text-xs font-semibold bg-[#0c1426] hover:bg-blue-600 text-cyan-300 hover:text-white border border-cyan-800/40 transition-all shadow-sm"
                title="Mở Focus Console chi tiết cho service này"
              >
                <span>📺</span>
                <span>Console</span>
              </button>

              <button
                onClick={() => onClearLogs(service.id)}
                className="flex items-center space-x-1 py-2 px-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-red-400 border border-slate-700 transition-all"
                title="Xóa console logs"
              >
                <span>🗑</span>
              </button>
            </div>
          </div>

          {/* Embedded Terminal (Height 340px) */}
          <div className="p-2.5 bg-terminalBg flex-1">
            <TerminalView
              logs={logs}
              serviceName={service.name}
              onClear={() => onClearLogs(service.id)}
              onTogglePopout={() => onTogglePopout(service)}
              className="h-[340px]"
            />
          </div>
        </div>
      );
    }

    // ================= TERMINAL VIEW =================
    function TerminalView({
      logs = [],
      serviceName,
      onClear,
      onTogglePopout,
      className = '',
      isFullHeight = false
    }) {
      const terminalEndRef = useRef(null);
      const containerRef = useRef(null);
      const [autoScroll, setAutoScroll] = useState(true);
      const [filterKeyword, setFilterKeyword] = useState('');

      const filteredLogs = useMemo(() => {
        if (!filterKeyword.trim()) return logs;
        const kw = filterKeyword.toLowerCase();
        return logs.filter(l => l.text && l.text.toLowerCase().includes(kw));
      }, [logs, filterKeyword]);

      const renderedLogs = useMemo(() => {
        if (!filteredLogs || filteredLogs.length === 0) return '';
        return filteredLogs.map(l => parseAnsi(l.text || '')).join('');
      }, [filteredLogs]);

      useEffect(() => {
        if (autoScroll && terminalEndRef.current) {
          terminalEndRef.current.scrollIntoView({ behavior: 'auto' });
        }
      }, [renderedLogs, autoScroll]);

      const handleScroll = () => {
        if (!containerRef.current) return;
        const { scrollTop, scrollHeight, clientHeight } = containerRef.current;
        setAutoScroll(scrollHeight - scrollTop - clientHeight < 40);
      };

      return (
        <div className={`relative flex flex-col bg-terminalBg border border-slate-800/90 rounded-xl overflow-hidden ${className}`}>
          {/* Terminal Bar */}
          <div className="flex items-center justify-between px-3.5 py-2 bg-[#090e1b] border-b border-slate-800/80 text-xs text-slate-400 flex-shrink-0">
            <div className="flex items-center space-x-2.5">
              <span className="inline-block w-2.5 h-2.5 rounded-full bg-slate-600"></span>
              <span className="font-mono text-slate-200 font-semibold">{serviceName ? `Console: ${serviceName}` : 'Console Output'}</span>
              <span className="text-[10px] text-slate-500 font-mono">({logs.length} lines)</span>
            </div>

            {/* Terminal Actions & Search */}
            <div className="flex items-center space-x-2">
              <input
                type="text"
                placeholder="Filter logs..."
                value={filterKeyword}
                onChange={(e) => setFilterKeyword(e.target.value)}
                className="bg-[#050811] border border-slate-700/80 rounded px-2 py-0.5 text-[11px] text-slate-200 font-mono focus:outline-none focus:border-blue-500 w-28 md:w-36"
              />

              {!autoScroll && (
                <button
                  onClick={() => { setAutoScroll(true); terminalEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }}
                  className="text-[10px] px-2 py-0.5 rounded bg-blue-600/20 text-blue-400 border border-blue-500/30"
                >
                  ↓ Cuộn
                </button>
              )}

              {onClear && (
                <button onClick={onClear} title="Xóa logs" className="hover:text-red-400 text-slate-400 p-1">
                  🗑
                </button>
              )}

              {onTogglePopout && (
                <button onClick={onTogglePopout} title="Phóng to" className="hover:text-cyan-400 text-slate-400 p-1">
                  ↗
                </button>
              )}
            </div>
          </div>

          {/* Terminal Logs Content */}
          <div
            ref={containerRef}
            onScroll={handleScroll}
            className="flex-1 p-3.5 overflow-y-auto font-mono text-xs text-slate-300 leading-relaxed whitespace-pre-wrap break-all select-text"
          >
            {filteredLogs.length === 0 ? (
              <div className="text-slate-600 italic py-8 text-center select-none">
                {logs.length === 0 ? 'Chưa có log... Hãy bấm Start để khởi động dịch vụ.' : 'Không tìm thấy dòng log khớp với từ khóa filter.'}
              </div>
            ) : (
              <div dangerouslySetInnerHTML={{ __html: renderedLogs }} />
            )}
            <div ref={terminalEndRef} />
          </div>
        </div>
      );
    }

    // ================= MODAL ENV =================
    function EnvModal({ service, isOpen, onClose, onSaveOverrides }) {
      if (!isOpen || !service) return null;

      const [envPairs, setEnvPairs] = useState([]);
      const [newKey, setNewKey] = useState('');
      const [newValue, setNewValue] = useState('');
      const [savedSuccess, setSavedSuccess] = useState(false);

      useEffect(() => {
        if (service && service.computedEnv) {
          const pairs = Object.entries(service.computedEnv).map(([key, value]) => ({
            key,
            value: String(value)
          }));
          setEnvPairs(pairs);
        }
      }, [service]);

      const handleValueChange = (index, val) => {
        const updated = [...envPairs];
        updated[index].value = val;
        setEnvPairs(updated);
      };

      const handleAddPair = () => {
        if (!newKey.trim()) return;
        setEnvPairs([...envPairs, { key: newKey.trim().toUpperCase(), value: newValue }]);
        setNewKey('');
        setNewValue('');
      };

      const handleDeletePair = (index) => {
        setEnvPairs(envPairs.filter((_, i) => i !== index));
      };

      const handleSave = async () => {
        const overrides = {};
        for (const item of envPairs) {
          overrides[item.key] = item.value;
        }
        await onSaveOverrides(service.id, overrides);
        setSavedSuccess(true);
        setTimeout(() => {
          setSavedSuccess(false);
          onClose();
        }, 800);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
          <div className="bg-appCard border border-slate-700 rounded-2xl w-full max-w-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden animate-in fade-in zoom-in duration-150">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-[#090d16]">
              <div>
                <h3 className="text-base font-bold text-white">
                  Cấu hình Biến Môi Trường: <span className="font-mono text-cyan-400">{service.name}</span>
                </h3>
                <p className="text-xs text-slate-400">
                  Profile: <span className="text-emerald-400 font-semibold">{service.activeProfile}</span> — Tùy chỉnh giá trị nạp khi start.
                </p>
              </div>
              <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-white rounded text-base">✕</button>
            </div>

            <div className="p-6 flex-1 overflow-y-auto space-y-2">
              <div className="grid grid-cols-12 gap-2 text-xs font-semibold text-slate-400 px-2 uppercase">
                <div className="col-span-5">Key / Variable</div>
                <div className="col-span-6">Value</div>
                <div className="col-span-1 text-center">Xóa</div>
              </div>

              {envPairs.map((pair, index) => (
                <div key={pair.key + index} className="grid grid-cols-12 gap-2 items-center bg-[#050811] p-2 rounded-xl border border-slate-800">
                  <div className="col-span-5 font-mono text-xs text-cyan-300 font-medium px-2 truncate" title={pair.key}>
                    {pair.key}
                  </div>
                  <div className="col-span-6">
                    <input
                      type="text"
                      value={pair.value}
                      onChange={(e) => handleValueChange(index, e.target.value)}
                      className="w-full bg-[#090e1c] border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-blue-500"
                    />
                  </div>
                  <div className="col-span-1 flex justify-center">
                    <button onClick={() => handleDeletePair(index)} className="p-1 text-slate-500 hover:text-red-400">
                      🗑
                    </button>
                  </div>
                </div>
              ))}

              <div className="mt-4 pt-4 border-t border-slate-800">
                <h4 className="text-xs font-bold text-slate-300 mb-2">Thêm biến mới:</h4>
                <div className="grid grid-cols-12 gap-2 items-center">
                  <div className="col-span-5">
                    <input
                      type="text"
                      placeholder="KEY_NAME"
                      value={newKey}
                      onChange={(e) => setNewKey(e.target.value)}
                      className="w-full bg-[#090e1c] border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 font-mono uppercase focus:outline-none focus:border-blue-500"
                    />
                  </div>
                  <div className="col-span-5">
                    <input
                      type="text"
                      placeholder="Value..."
                      value={newValue}
                      onChange={(e) => setNewValue(e.target.value)}
                      className="w-full bg-[#090e1c] border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-blue-500"
                    />
                  </div>
                  <div className="col-span-2">
                    <button
                      type="button"
                      onClick={handleAddPair}
                      className="w-full px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg"
                    >
                      + Thêm
                    </button>

                </div>
              </div>
            </div>

            <div className="flex items-center justify-between px-6 py-4 bg-[#090d16] border-t border-slate-800">
              <span className="text-xs text-slate-500">* Tự động lưu vào profile cá nhân</span>

                <button onClick={onClose} className="px-4 py-1.5 text-xs font-medium text-slate-400 hover:text-white bg-slate-800 rounded-lg">

            </div>

    // ================= CATEGORY MODAL (CREATE & EDIT) =================
    function CategoryModal({ category, isOpen, onClose, onSave }) {
      if (!isOpen) return null;
      const isEdit = !!category;

      const [id, setId] = useState(category?.id || '');
      const [name, setName] = useState(category?.name || '');
      const [description, setDescription] = useState(category?.description || '');
      const [icon, setIcon] = useState(category?.icon || '📁');
      const [color, setColor] = useState(category?.color || '#38bdf8');
      const [error, setError] = useState('');

      const iconOptions = ['📁', '🖥️', '⚡', '⚙️', '🚪', '📦', '🤖', '🛡️', '💳', '📊', '🔔', '🌐', '🗄️', '🔍'];
      const colorOptions = [
        { label: 'Sky Blue', value: '#38bdf8' },
        { label: 'Emerald', value: '#10b981' },
        { label: 'Purple', value: '#a855f7' },
        { label: 'Amber', value: '#f59e0b' },
        { label: 'Rose', value: '#f43f5e' },
        { label: 'Cyan', value: '#06b6d4' },
        { label: 'Pink', value: '#ec4899' },
        { label: 'Slate', value: '#64748b' }
      ];

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (!name.trim()) return setError('Vui lòng nhập Tên danh mục');
        if (!id.trim()) return setError('Vui lòng nhập Mã danh mục (ID)');

        try {
          await onSave({
            id: id.trim().toUpperCase().replace(/\s+/g, '_'),
            name: name.trim(),
            description: description.trim(),
            icon,
            color
          });
          onClose();
        } catch (err) {
          setError(err.message);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-in fade-in">
          <div className="bg-appCard border border-slate-700 rounded-2xl w-full max-w-lg shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-150">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-[#090d16]">
              <h3 className="text-base font-bold text-white flex items-center gap-2">
                <span>{icon}</span>
                <span>{isEdit ? `Chỉnh sửa Danh Mục: ${category.name}` : 'Thêm Danh Mục Mới'}</span>
              </h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white rounded text-base">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              {error && (
                <div className="p-3 bg-rose-950/40 border border-rose-500/40 text-rose-300 text-xs rounded-xl font-medium">
                  ✖ {error}
                </div>
              )}

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-300 block mb-1 font-bold">Mã Danh Mục (ID) *</label>
                  <input
                    type="text"
                    disabled={isEdit}
                    placeholder="ví dụ: FRONTEND, BACKEND"
                    value={id}
                    onChange={(e) => setId(e.target.value.toUpperCase())}
                    className="w-full bg-[#050811] border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-500 uppercase disabled:opacity-50"
                  />
                </div>

                <div>
                  <label className="text-xs text-slate-300 block mb-1 font-bold">Tên Hiển Thị (Display Name) *</label>
                  <input
                    type="text"
                    placeholder="ví dụ: Frontend Services"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full bg-[#050811] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500"
                  />
                </div>
              </div>

              <div>
                <label className="text-xs text-slate-300 block mb-1 font-bold">Mô Tả Danh Mục</label>
                <input
                  type="text"
                  placeholder="ví dụ: Các ứng dụng giao diện người dùng và web portal"
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full bg-[#050811] border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                />
              </div>

              {/* Icon Picker */}
              <div>
                <label className="text-xs text-slate-300 block mb-1.5 font-bold">Icon Đại Diện:</label>
                <div className="flex flex-wrap gap-1.5 bg-[#050811] p-2.5 rounded-xl border border-slate-800">
                  {iconOptions.map(ic => (
                    <button
                      key={ic}
                      type="button"
                      onClick={() => setIcon(ic)}
                      className={`w-9 h-9 rounded-lg text-lg flex items-center justify-center transition-all ${
                        icon === ic ? 'bg-indigo-600 text-white shadow-md scale-110 ring-2 ring-indigo-400' : 'bg-[#090e1b] hover:bg-slate-800 text-slate-300'
                      }`}
                    >
                      {ic}
                    </button>
                  ))}
                </div>
              </div>

              {/* Color Preset Picker */}
              <div>
                <label className="text-xs text-slate-300 block mb-1.5 font-bold">Màu Sắc Nhận Diện (Color Badge):</label>
                <div className="flex flex-wrap gap-2">
                  {colorOptions.map(c => (
                    <button
                      key={c.value}
                      type="button"
                      onClick={() => setColor(c.value)}
                      className={`flex items-center space-x-1.5 px-2.5 py-1 rounded-lg border text-xs font-mono transition-all ${
                        color === c.value
                          ? 'border-white text-white font-bold shadow-md ring-1 ring-white'
                          : 'border-slate-800 text-slate-400 hover:text-white'
                      }`}
                      style={{ backgroundColor: `${c.value}20` }}
                    >
                      <span className="w-3 h-3 rounded-full" style={{ backgroundColor: c.value }}></span>
                      <span>{c.label}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex justify-end space-x-3 pt-3 border-t border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs text-slate-400 hover:text-white bg-slate-800 rounded-xl"
                >
                  Hủy
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 text-xs font-bold text-white bg-purple-600 hover:bg-purple-500 rounded-xl shadow-lg shadow-purple-900/30"
                >
                  {isEdit ? 'Lưu Thay Đổi' : 'Tạo Danh Mục'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ================= CATEGORY MANAGER PAGE =================
    function CategoryManagerPage({
      categories = [],
      services = [],
      onCreateCategory,
      onUpdateCategory,
      onDeleteCategory,
      onReloadCategories,
      onNavigateToServices
    }) {
      const [modalCategory, setModalCategory] = useState(undefined); // undefined = closed, null = new, object = edit
      const [searchQuery, setSearchQuery] = useState('');
      const [actionStatus, setActionStatus] = useState('');

      const filteredCategories = categories.filter(c => {
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        return (c.name || '').toLowerCase().includes(q) || (c.id || '').toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q);
      });

      const handleDelete = async (catId, catName) => {
        if (!confirm(`Bạn có chắc chắn muốn xóa danh mục "${catName || catId}" không?\n(Các service thuộc danh mục này sẽ được chuyển về nhóm "SERVICE")`)) return;
        try {
          await onDeleteCategory(catId, 'SERVICE');
          setActionStatus(`✔ Đã xóa danh mục "${catName || catId}" thành công!`);
          setTimeout(() => setActionStatus(''), 3000);
        } catch (e) {
          alert('Lỗi: ' + e.message);
        }
      };

      return (
        <div className="h-full flex flex-col space-y-4 max-w-[1900px] mx-auto overflow-y-auto pr-1">
          
          {/* Header Banner */}
          <div className="flex flex-wrap items-center justify-between gap-4 bg-appCard border border-slate-800 p-5 rounded-2xl shadow-xl">
            <div className="space-y-1">
              <div className="flex items-center space-x-2">
                <span className="text-xl">🏷️</span>
                <h2 className="text-base font-bold text-white tracking-wide">Quản Lý Danh Mục (Categories & Groups)</h2>
                <span className="text-xs font-mono px-2 py-0.5 rounded-full bg-purple-950/80 text-purple-300 border border-purple-800/40">
                  {categories.length} Danh Mục
                </span>
              </div>
              <p className="text-xs text-slate-400">
                Tổ chức và phân loại các microservice theo từng nhóm chức năng (FE, BFF, Service, Gateway, Worker...).
              </p>
            </div>

            <div className="flex items-center space-x-2.5">
              <button
                onClick={() => setModalCategory(null)}
                className="px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-purple-900/40 transition-all flex items-center space-x-1.5"
              >
                <span>➕</span>
                <span>Thêm Danh Mục Mới</span>
              </button>
            </div>
          </div>

          {actionStatus && (
            <div className="p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/40 text-emerald-300 text-xs font-medium animate-in fade-in">
              {actionStatus}
            </div>
          )}

          {/* Search bar */}
          <div className="flex items-center justify-between bg-[#080d19] p-3 rounded-xl border border-slate-800">
            <div className="relative w-72">
              <input
                type="text"
                placeholder="Tìm kiếm danh mục..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full bg-[#050811] border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-500"
              />
              <span className="absolute left-2.5 top-2 text-xs text-slate-500">🔍</span>
            </div>
            <span className="text-xs text-slate-400 font-mono">
              Hiển thị {filteredCategories.length} / {categories.length} danh mục
            </span>
          </div>

          {/* Category Cards Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filteredCategories.length === 0 ? (
              <div className="col-span-full py-12 text-center text-slate-500 text-sm font-mono bg-appCard border border-slate-800 rounded-2xl">

            ) : (
              filteredCategories.map(cat => {
                const accentColor = cat.color || '#38bdf8';
                const catServices = cat.services || services.filter(s => (s.group || s.category || '').toUpperCase() === cat.id);

                return (
                  <div
                    key={cat.id}
                    className="bg-appCard border border-slate-800/90 hover:border-slate-700 rounded-2xl p-5 flex flex-col justify-between shadow-xl transition-all hover:shadow-2xl group"
                  >
                    <div>
                      {/* Card Header */}
                      <div className="flex items-start justify-between gap-3 mb-3">
                        <div className="flex items-center space-x-3">
                          <div
                            className="w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-inner border flex-shrink-0"
                            style={{ backgroundColor: `${accentColor}20`, borderColor: `${accentColor}40` }}
                          >
                            {cat.icon || '📁'}
                          </div>
                          <div>
                            <h3 className="text-sm font-bold text-white font-mono group-hover:text-cyan-300 transition-colors">
                              {cat.name || cat.id}
                            </h3>
                            <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                              ID: {cat.id}

                        </div>

                        <button
                          onClick={() => onNavigateToServices && onNavigateToServices(cat.id)}
                          className="px-2.5 py-1 rounded-lg text-xs font-mono font-bold transition-all border flex items-center space-x-1"
                          style={{ backgroundColor: `${accentColor}15`, color: accentColor, borderColor: `${accentColor}40` }}
                          title={`Xem ${catServices.length} service thuộc nhóm ${cat.name || cat.id}`}
                        >
                          <span>{catServices.length} services</span>
                        </button>
                      </div>

                      {/* Description */}
                      <p className="text-xs text-slate-400 mb-4 min-h-[32px] line-clamp-2">
                        {cat.description || `Các microservices thuộc nhóm ${cat.name || cat.id}.`}
                      </p>

                      {/* Services Chips */}
                      <div className="space-y-1 mb-4 bg-[#050811] p-2.5 rounded-xl border border-slate-800/80">
                        <span className="text-[10px] font-mono uppercase font-bold text-slate-500 block">
                          Microservices trong nhóm:
                        </span>
                        <div className="flex flex-wrap gap-1 max-h-24 overflow-y-auto">
                          {catServices.length === 0 ? (
                            <span className="text-[11px] text-slate-500 italic">Chưa có service nào</span>
                          ) : (
                            catServices.map(s => (
                              <span
                                key={s.id}
                                className="inline-flex items-center space-x-1 px-2 py-0.5 rounded-md bg-[#0c1426] border border-slate-700/80 text-[10px] font-mono text-cyan-200"
                              >
                                <span>●</span>
                                <span className="font-bold">{s.name}</span>
                                {s.port && <span className="text-purple-300">:{s.port}</span>}
                              </span>
                            ))
                          )}
                        </div>
                      </div>
                    </div>

                    {/* Footer Actions */}
                    <div className="flex items-center justify-between pt-3 border-t border-slate-800/80">
                      <button
                        onClick={() => onNavigateToServices && onNavigateToServices(cat.id)}
                        className="px-3 py-1.5 text-xs text-blue-400 hover:text-white bg-blue-950/30 hover:bg-blue-600/30 rounded-lg transition-colors border border-blue-800/40 flex items-center space-x-1 font-mono"
                      >
                        <span>🔍</span>
                        <span>Lọc Services</span>
                      </button>

                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => setModalCategory(cat)}
                          className="px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors border border-slate-700 flex items-center space-x-1"
                        >
                          <span>✏️</span>
                          <span>Sửa</span>
                        </button>

                        <button
                          onClick={() => handleDelete(cat.id, cat.name)}
                          className="px-3 py-1.5 text-xs font-semibold text-rose-400 hover:text-white bg-rose-950/20 hover:bg-rose-600 rounded-lg transition-colors border border-rose-800/30 flex items-center space-x-1"
                        >
                          <span>🗑️</span>
                          <span>Xóa</span>
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {/* Modal */}
          {modalCategory !== undefined && (
            <CategoryModal
              category={modalCategory}
              isOpen={true}
              onClose={() => setModalCategory(undefined)}
              onSave={async (data) => {
                if (modalCategory) {
                  await onUpdateCategory(modalCategory.id, data);
                } else {
                  await onCreateCategory(data);
                }
                setModalCategory(undefined);
              }}
            />
          )}

        </div>
      );
    }

    // ================= SERVICES & TEMPLATES MANAGER PAGE =================
    function ServiceManagerPage({
      services = [],
      categories = [],
      templates = [],
      onCreateService,
      onUpdateService,
      onDeleteService,
      onResetServices,
      onExportAll,
      onExportSingle,
      onImportConfig,
      onReloadServices

      const [showImportModal, setShowImportModal] = useState(false);

      const filteredServices = services.filter(s => {
        const matchesGroup = activeGroupFilter === 'ALL' || s.group === activeGroupFilter;
        const matchesSearch = !searchQuery.trim() || 
          s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
          s.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
          String(s.port).includes(searchQuery);

          setActionStatus(`✔ Đã xóa service ${serviceName}!`);

              </div>

                <span>Thêm Service Mới</span>

              <button

                <span>📤</span>
                <span>Export All Config</span>
              </button>

              <button
                onClick={() => setShowImportModal(true)}
                className="px-3.5 py-2 bg-[#0c1424] hover:bg-indigo-600/20 text-indigo-300 hover:text-white border border-indigo-500/30 hover:border-indigo-500/60 rounded-xl text-xs font-semibold transition-all flex items-center space-x-1.5"
                title="Nhập cấu hình từ file JSON bên ngoài"
